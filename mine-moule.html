<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Mine-Moule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
#touch.hidebtn .tb:not(#tP){display:none}
.tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(42,27,18,.55);border:2px solid rgba(243,230,196,.6);color:#f3e6c4;font:700 22px 'Nunito','Trebuchet MS','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box}
.tb.on{background:rgba(255,210,63,.55)}
.tb.big{width:78px;height:78px;font-size:26px}
.tb.sm{width:44px;height:44px;font-size:18px;border-radius:10px}
#tL{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(110px + env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#tD{left:calc(62px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#tJ{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#tE{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#tF{left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:17px;border-radius:10px}
#tS{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#tA{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#tP{right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,2,.55);padding:16px;box-sizing:border-box}
#modal[hidden]{display:none}
.panel{background:#2a1b12;border:4px solid #0e0805;box-shadow:inset 0 0 0 3px #6b4a2e;color:#f3e6c4;font:500 16px 'Nunito','Trebuchet MS','Segoe UI',sans-serif;padding:22px 24px;width:min(460px,100%);box-sizing:border-box;max-height:100%;overflow:auto}
.panel h2{margin:0 0 14px;font-size:26px;color:#ffd23f;letter-spacing:.03em}
.panel label.f{display:block;margin:10px 0 6px;color:#c9b48a;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.panel input[type=text]{width:100%;box-sizing:border-box;font:700 20px 'Nunito','Trebuchet MS','Segoe UI',sans-serif;background:#f3e6c4;color:#2a1b12;border:3px solid #0e0805;padding:8px 10px;outline:none}
.panel input[type=text]:focus{box-shadow:0 0 0 3px #ffd23f}
.panel fieldset{border:0;padding:0;margin:10px 0 0}
.panel legend{color:#c9b48a;font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;padding:7px 11px;background:#3b2618;border:2px solid #0e0805;box-shadow:inset 0 0 0 2px #5a3b24}
.opts input:checked+span{background:#ffd23f;color:#2a1b12;box-shadow:none}
.opts input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.row button{font:700 17px 'Nunito','Trebuchet MS','Segoe UI',sans-serif;padding:9px 16px;border:3px solid #0e0805;cursor:pointer;background:#5a3b24;color:#f3e6c4}
.row button.go{background:#ffd23f;color:#2a1b12}
.row button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div class="tb" id="tL" data-act="left">◀</div>
  <div class="tb" id="tR" data-act="right">▶</div>
  <div class="tb" id="tD" data-act="down">▼</div>
  <div class="tb big" id="tJ" data-act="up">▲</div>
  <div class="tb" id="tE" data-act="use">E</div>
  <div class="tb" id="tF" data-act="equip">F</div>
  <div class="tb big" id="tS" data-act="atk">⚔</div>
  <div class="tb" id="tA" data-act="inv">A</div>
  <div class="tb sm" id="tP" data-act="pause">II</div>
</div>
<div id="modal" hidden>
  <form class="panel" id="ngForm" autocomplete="off">
    <h2 id="ngTitle">Nouvelle partie</h2>
    <label class="f" for="ngName" id="ngNameL">Nom</label>
    <input type="text" id="ngName" maxlength="16" value="Oggy">
    <fieldset><legend id="ngFlavorL">Monde</legend><div class="opts" id="ngFlavor"></div></fieldset>
    <fieldset><legend id="ngLenL">Saisons</legend><div class="opts" id="ngLen"></div></fieldset>
    <fieldset><legend id="ngModeL">Mode</legend><div class="opts" id="ngMode"></div></fieldset>
    <fieldset><legend id="ngGradeL">Maths</legend><div class="opts" id="ngGrade"></div></fieldset>
    <div class="row"><button type="button" id="ngCancel">Annuler</button><button type="submit" class="go" id="ngStart">Commencer</button></div>
  </form>
</div>

'use strict';

function hiDraw(fn) { const k = Math.max(1, Math.min(4, VIEW.s || 1));

  if (!HI.used) { HI.x.setTransform(1, 0, 0, 1, 0, 0); HI.x.clearRect(0, 0, HI.c.width, HI.c.height); HI.used = true; }
  const keep = ctx; ctx = HI.x; ctx.save(); ctx.setTransform(k, 0, 0, k, 0, 0); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

const hiOn = () => ctx === HI.x;
const landC = mkC(W, H), landX = landC.getContext('2d');

function layout() {

}

    en: ['The Great Siege really caps at 10 monsters a night (a leftover setting raised it back to 14 when you were home).'] },
  { v: '1.11.1', k: 'x', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Correctif : une partie sauvegardée avant la 1.11 restait sur un écran noir au chargement. Elle se charge de nouveau, et les quêtes déjà remplies se valident au réveil.'],
    en: ['Fix: a game saved before 1.11 stayed on a black screen when loaded. It loads again, and quests you had already done complete when you wake up.'] },
  { v: '1.11.0', k: 'bbbfiffiii', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Toutes les histoires peuvent se terminer : chaque monde a maintenant le camp des brigands, la bibliothèque engloutie (sous un lac ou le vieux puits d’un marché), au moins 2 crabes-boucliers, un corbeau voleur près de chez toi, deux grottes, une salle à boîte à musique et une salle du dragon.', 'Les coffres-croqueurs existent enfin : quand leur quête est ouverte, l’un d’eux dort dans la première salle de chaque grotte et se réveille quand tu approches.', 'Rien ne se perd plus : casser le mur de l’arcade, trouver une salle secrète, résoudre la pierre de la Traversée ou fabriquer un objet avant sa quête la valide quand elle s’ouvre.', 'Le journal montre la quête en entier, sa récompense et ce qui ouvre les pages verrouillées ; la Finale a sa ligne. Entrée suit une quête à l’écran, sous la carte.', 'Noms de quêtes en anglais, textes français et anglais alignés sur ce que le jeu vérifie (L11, C4, E2, F3, F5, F9…), sans codes internes.', 'Panneaux : la ligne choisie s’ouvre avec la tâche et la récompense. Les villageois parlent avec leur propre voix. Un prologue de grand-mère en trois images.', 'On pêche toute l’année (sous la glace en hiver), 3 poissons par coin par jour, et chaque marché vend 3 poissons pour 2 métal.', 'Moins de corvées : 6 diablotins, 2 crabes, 2 scarabées, 2 harpies, une 3ᵉ gargouille ; le Grand Siège plafonne à 10 monstres et une nuit ratée n’efface plus les autres ; la tente remet l’énergie au plein.', 'Les Terres commencent à 1,6× et durcissent avec la distance ; le golem tombe en 30 coups au plus et dit quoi utiliser ; la lame d’obsidienne perce les armures.', 'Le minerai repousse chaque saison et les pierres savantes se réveillent une semaine après.'],
    en: ['Every story can now be finished: each world has the brigand camp, the sunken library (under a lake or a market’s old well), at least 2 shield crabs, a thief crow near home, two caves, a music-box room and a dragon room.', 'Mimic chests finally exist: while their quest is open, one sleeps in the first hall of every cave and wakes when you come close.', 'Nothing is lost any more: breaking the arcade wall, finding a secret room, solving the Crossing stone or crafting an item before its quest now counts when the quest opens.', 'The journal shows the whole task, its reward and what unlocks locked pages; the Finale has its own row. Enter shows a quest on screen, under the map.', 'English quest names; French and English texts now match what the game checks (L11, C4, E2, F3, F5, F9…), with no internal codes.', 'Notice boards: the chosen row opens up with the task and reward. Villagers talk in their own voice. A three-picture prologue from Grandma.', 'Fish bite all year (through the ice in winter), 3 catches per spot per day, and every market sells 3 fish for 2 metal.', 'Less grind: 6 imps, 2 crabs, 2 beetles, 2 harpies, a third gargoyle; the Great Siege caps at 10 monsters and a lost night no longer wipes the others; the tent restores full energy.', 'The Lands start at 1.6× and get harder with distance; the golem falls in 30 hits at most and says what to use; the obsidian blade pierces armour.', 'Ore grows back every season and scholar’s stones wake up a week after you solve them.'] },
  { v: '1.10.4', k: 'xx', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Les grottes gardent leur entrée dégagée : plus de rocher, de tas de pierres ni de pierre à énigme devant l’ouverture.', 'Une grotte tout au bout d’une région n’est plus à moitié cachée par la falaise (ni sous l’arche du Grand Nord) : elle est déplacée plus loin du bord.'],
    en: ['Caves keep their doorstep clear: no more boulder, stone pile or riddle stone in front of the opening.', 'A cave at the very end of a region is no longer half hidden by the cliff (or under the Frozen North arch): it moves away from the edge.'] },
  { v: '1.10.3', k: 'fi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Lance-pierres : il vise tout seul le monstre le plus proche dans un rayon d’une demi-largeur d’écran (le héros se tourne vers lui), et la pierre suit une vraie courbe avec la gravité — du haut d’une tour, elle plonge sur sa cible. Sans cible, c’est un lancer en cloche qui retombe à environ une demi-largeur d’écran.', 'La pierre tourne en vol et laisse une petite traînée.'],
    en: ['Rock thrower: it aims by itself at the closest monster within half a screen (the hero turns toward it), and the stone follows a real curve under gravity — from the top of a tower it dives onto its target. With nothing in range, it is a lob that lands about half a screen away.', 'The stone spins in flight and leaves a small trail.'] },
  { v: '1.10.2', k: 'ix', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Voyage rapide : le mode chiffres garde les icônes et les titres Énergie / Faim, seuls les chiffres remplacent les barres.', 'Voyage rapide : tant que tu arrives vivant (un peu d’énergie et pas encore mort de faim), le voyage est permis, même si tu arrives à bout de forces — un avertissement jaune te prévient. Il n’est refusé que si tu t’écroulerais en chemin.'],
    en: ['Quick travel: numbers view keeps the Energy / Hunger icons and titles; only the numbers replace the bars.', 'Quick travel: as long as you arrive alive (a little energy left and not starving), the trip is allowed, even running on empty — a yellow warning tells you. It is only refused if you would collapse on the way.'] },
  { v: '1.10.1', k: 'i', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Voyage rapide : par défaut, la fenêtre montre tes vraies barres d’énergie et de faim, et la portion qui va fondre ou grossir clignote doucement (en rouge si le trajet est impossible). Tab (ou le petit interrupteur en haut) bascule vers les chiffres.'],
    en: ['Quick travel: by default the window shows your real energy and hunger bars, and the slice that will shrink or grow breathes in and out (red if the trip can’t be done). Tab (or the little switch at the top) flips to the numbers.'] },
  { v: '1.10.0', k: 'fi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Voyage rapide depuis la carte du monde : choisis un lieu déjà découvert, puis « Voyage rapide » (Entrée, ✕ à la manette, ou clic). Le trajet est instantané, mais il coûte le temps, l’énergie et la faim d’une course jusque-là — même à travers les passages entre les anneaux.', 'La fenêtre de confirmation montre la durée, l’énergie et la faim avant → après. Si tu es trop épuisé ou trop affamé pour tenir le trajet, en pleine bagarre ou dans une grotte, le voyage est refusé et la raison est affichée.'],
    en: ['Quick travel from the world map: pick any place you have discovered, then “Quick travel” (Enter, ✕ on a controller, or click). The trip is instant, but it costs the time, energy and hunger of running all the way there — even through the passages between rings.', 'The confirm window shows the time, energy and hunger before → after. If you are too worn out or too hungry to last the trip, in the middle of a fight, or in a cave, the trip is refused and the reason shown.'] },
  { v: '1.9.5', k: 'x', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Chutes : ce qui compte maintenant, c’est la hauteur dont tu tombes sous l’endroit d’où tu es parti — l’arc d’un saut normal est gratuit. On ne se fait mal qu’au-delà d’une fois et demie la hauteur du plus haut saut (environ 4 blocs et demi) : sauter d’une tour de 3 blocs ou descendre d’une marche ne fait plus mal.'],
    en: ['Falls: what counts now is how far below your take-off point you land — a normal jump’s arc is free. You only get hurt beyond 1.5× the highest jump (about 4½ blocks): jumping off a 3-block tower or down one step no longer hurts.'] },
  { v: '1.9.4', k: 'ixi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Le bout du monde n’est plus un mur de briques : c’est la nature qui t’arrête. Une falaise à pic qui monte plus haut que l’écran (glacée dans le Grand Nord, veinée de lave dans les Terres Brûlées), un ravin sans fond avec sa clôture cassée et son panneau « ! » (lave tout au fond chez les braises, nuages chez les Îles du Ciel), ou un mur de ronces impénétrable.', 'Au-delà du bord, tout est maintenant dessiné : plus de traces bizarres quand il pleut, et la lampe frontale éclaire la falaise comme il faut.', 'Le héros dit ce qui le bloque : falaise, ravin ou ronces.'],
    en: ['The end of the world is no longer a brick wall: nature stops you. A sheer cliff rising past the top of the screen (icy in the Frozen North, veined with lava in the Badlands), a bottomless ravine with a broken fence and a “!” sign (lava at the bottom in the Badlands, clouds in the Sky Islands), or an impassable wall of brambles.', 'Beyond the edge everything is drawn now: no more odd trails when it rains, and the headlamp lights the cliff properly.', 'The hero says what is blocking the way: cliff, ravine or brambles.'] },
  { v: '1.9.3', k: 'ii', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Villages : de vrais longs noms à la québécoise, avec des traits d’union et des précisions bizarres — Saint-Caillou-des-Sept-Corneilles, Sainte-Pomme-de-l’Épouvante, Mont-Gravier-de-la-Dernière-Chance, Saint-Grelot-du-Ha! Ha!, Notre-Dame-du-Bon-Bouillon… Ta partie garde ses villages au même endroit, seuls les noms changent.', 'Sur la carte d’ensemble, le début du nom suffit (Saint-Caillou…) ; zoome pour lire le nom complet. Dans le panneau de la carte, les noms longs passent sur deux lignes.'],
    en: ['Villages: real long Quebec-style names, with dashes and oddly specific extras — Saint-Caillou-des-Sept-Corneilles, Sainte-Pomme-de-l’Épouvante, Mont-Gravier-de-la-Dernière-Chance, Saint-Grelot-du-Ha! Ha!, Notre-Dame-du-Bon-Bouillon… Your save keeps its villages in the same places, only the names change.', 'On the map overview the start of the name is enough (Saint-Caillou…); zoom in to read the whole name. In the map panel, long names wrap onto two lines.'] },
  { v: '1.9.2', k: 'fb', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Lampe frontale : troisième évolution de la lanterne, après la lanterne d’argent (four amélioré : 2 or, 1 argent, 2 métal, 1 toile). Elle garde tout ce que fait la lanterne d’argent et, la nuit, un faisceau doux part de ton front dans la direction où tu regardes et éclaire le chemin jusqu’à la moitié de l’écran. Il pivote en douceur quand tu te retournes et s’allume tout seul au crépuscule.', 'L’établi de campagne ne fait plus la cuisine : c’est le rôle du feu de camp. Le titre de la fenêtre dit maintenant « Établi de campagne » ou « Feu de camp ».'],
    en: ['Headlamp: the third lantern evolution, after the silver lantern (upgraded oven: 2 gold, 1 silver, 2 metal, 1 web). It keeps everything the silver lantern does and, at night, a soft beam leaves your forehead in the direction you face and lights the path up to half the screen. It swings smoothly when you turn around and switches on by itself at dusk.', 'The field bench no longer cooks: that’s the campfire’s job. The window title now says “Field bench” or “Campfire”.'] },
  { v: '1.9.1', k: 'i', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Menu pause : toutes les cases sont repeintes comme par un enfant à la gouache — gros traits qui tremblent, couleurs qui débordent, étoiles et cœurs : un livre ouvert sous un soleil qui sourit, une cape et une couronne, une carte au trésor (ou un métro rigolo), des notes qui dansent sur un arc-en-ciel, un tambour qui fait BOUM, deux oiseaux qui bavardent, un chat qui dort sur un coussin. Éteint, c’est barré au crayon rouge.'],
    en: ['Pause menu: every tile is repainted as if by a kid with poster paint — wobbly fat lines, colours spilling over, stars and hearts: an open book under a smiling sun, a cape and crown, a treasure map (or a silly subway), notes dancing on a rainbow, a drum going BOOM, two chatting birds, a cat asleep on a pillow. Off means scribbled out in red crayon.'] },
  { v: '1.9.0', k: 'ffffx', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Mode construction à la manette : L2 l’ouvre, un bloc fantôme apparaît devant le héros. Stick droit pour viser, R2 pour poser (garde appuyé pour enchaîner), □ maintenu pour casser, L1/R1 pour changer de bloc, ○ ou L2 pour quitter. Le héros marche toujours au stick gauche.', 'Le même mode au clavier : B pour l’ouvrir, flèches pour viser, Entrée pour poser, Retour arrière maintenu pour casser, 1–5 pour le bloc, B ou Échap pour quitter.', 'Petite carte : dans les autres anneaux, la bifurcation par laquelle tu es arrivé devient la racine (avec son icône, du bon côté, et le nombre de lieux jusqu’à elle), avec « ⌂↩N » pour le nombre d’anneaux jusqu’à la maison.', 'Petite carte : un ruban « Anneau 2 · L’Autre Rive » indique où tu es, et des panneaux montrent les sorties vers les anneaux suivants (une flèche au bord quand elles sont hors de vue, seulement si tu les as déjà découverts).', 'Villages la nuit : les lumières des maisons lointaines ne brillent plus par-dessus les maisons du premier plan.'],
    en: ['Controller build mode: L2 opens it and a ghost block appears in front of the hero. Right stick to aim, R2 to place (hold to keep going), hold □ to break, L1/R1 to switch blocks, ○ or L2 to leave. The hero still walks on the left stick.', 'The same mode on the keyboard: B to open it, arrows to aim, Enter to place, hold Backspace to break, 1–5 for the block, B or Esc to leave.', 'Corner map: in the other rings, the fork you came in by becomes the root (with its icon, on the correct side, and the number of places to it), with “⌂↩N” for how many rings back home is.', 'Corner map: a “Ring 2 · The Far Shore” ribbon shows where you are, and signposts mark the exits to the next rings (an arrow at the edge when they’re out of view, only once you’ve discovered them).', 'Villages at night: far-away house lights no longer shine over the houses in front.'] },
  { v: '1.8.8', k: 'x', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Carte de grand-mère : les chemins qui relient une région à la suivante contournent maintenant les lieux et les routes au lieu de les traverser tout droit, et passent sous les routes locales. On voit enfin clairement où sont les embranchements.'],
    en: ['Grandma’s map: the paths linking one region to the next now bend around places and roads instead of cutting straight across them, and run under the local roads. You can finally see clearly where the forks are.'] },
  { v: '1.8.7', k: 'f', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Plein écran : touche P, ou le bouton ⛶ sur l’écran titre et dans le menu pause. Le jeu remplit toute la largeur ou toute la hauteur en gardant ses proportions, même sur un grand écran.'],
    en: ['Full screen: press P, or the ⛶ button on the title screen and in the pause menu. The game fills the whole width or height while keeping its proportions, even on a big screen.'] },
  { v: '1.8.6', k: 'fi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Manette : L1 ouvre et ferme la carte du monde. Dans la carte, L2 zoome, R2 dézoome (garde appuyé pour continuer), le stick droit fait glisser la carte, et ○ revient à la vue d’ensemble.', 'Manette : le journal passe sur le bouton Share (il est aussi dans le menu pause).'],
    en: ['Controller: L1 opens and closes the world map. On the map, L2 zooms in, R2 zooms out (hold to keep going), the right stick glides the map around, and ○ goes back to the overview.', 'Controller: the journal moves to the Share button (it is also in the pause menu).'] },
  { v: '1.8.5', k: 'fbi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['L’établi de campagne (four + établi portatifs) rejoint la tente et le feu de camp dans l’Équipement (F) : « Installer l’établi ici », puis E devant pour fabriquer ou le ranger. Un établi déjà fabriqué est rangé automatiquement dans tes outils.', 'Fabriquer à l’établi de campagne coûte 1 bois de plus par recette : le four portatif a besoin de combustible. C’est affiché dans le coût.', 'Nouveau dessin pour l’établi de campagne : un petit four en terre avec un vrai feu qui danse et un peu de fumée.'],
    en: ['The field bench (portable oven + workbench) joins the tent and campfire in Equipment (F): “Set up the bench here”, then E in front to craft or pack it away. A bench you already made is moved to your tools automatically.', 'Crafting at the field bench costs 1 extra wood per recipe: the portable oven needs fuel. The cost shows it.', 'New look for the field bench: a little clay oven with a real dancing fire and a wisp of smoke.'] },
  { v: '1.8.4', k: 'i', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Cuisiner au feu de camp : le héros se place tout seul à côté du feu, la marmite posée sur les flammes et la poêle tenue juste au-dessus.'],
    en: ['Cooking at the campfire: the hero steps right up to the fire by themselves, with the pot sitting on the flames and the pan held just above.'] },
  { v: '1.8.3', k: 'ff', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Fenêtre des nouveautés : une page par série de versions (v1.8, v1.7… bêta), avec ◀ ▶ ; elle défile à la molette, au glisser, aux flèches ↑ ↓ ou par la barre de défilement.', 'Chaque changement porte une étiquette de couleur : Nouveauté, Amélioration, Correctif ou Équilibrage. Clique une étiquette en haut (ou 1 à 5) pour ne voir que celles-là.'],
    en: ['What’s-new window: one page per version series (v1.8, v1.7… beta) with ◀ ▶; scroll with the mouse wheel, by dragging, with ↑ ↓ or with the scrollbar.', 'Every change carries a coloured tag: Feature, Improvement, Bug fix or Balance. Click a tag at the top (or 1 to 5) to see only those.'] },
  { v: '1.8.2', k: 'i', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Abattre un arbre ou casser un rocher secoue beaucoup moins l’écran : l’arbre et le rocher tremblent toujours à chaque coup, mais plus doucement, et la chute ou l’éclatement final est moins brutal.'],
    en: ['Felling a tree or breaking a boulder shakes the screen far less: the tree and boulder still shudder on every hit, just more gently, and the final crash or burst is softer.'] },
  { v: '1.8.1', k: 'fiifif', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Nouvel écran Équipement : tes armes, armures, tenues et ton matériel de camp en cases ; à droite, la pièce choisie trône sur un piédestal, dans un décor peint (forge aux braises pour les armes, salle aux bannières pour les armures, nuit étoilée pour le camp), avec un reflet qui glisse dessus.', 'Clique l’image (ou Tab) pour voir le héros qui danse avec son équipement.', 'Sous l’image : la description et la puissance — barres de Puissance et de Vitesse pour les armes, protections pour les armures.', 'Nouveau menu Pause : de grandes cases carrées peintes à la main (Journal, Costumes, style de carte qui bascule, Musique, Bruitages, Langue, Mode doux) et des boutons Reprendre, Recommencer, Exporter, Sauvegarder, Quitter.', 'Le niveau de maths se choisit en faisant tourner une roue de cadenas.', 'Recommencer ramène à ta dernière sauvegarde (il faut appuyer deux fois).'],
    en: ['New Equipment screen: your weapons, armour, outfits and camp gear in slots; on the right the chosen piece sits on a pedestal in a painted setting (ember forge for weapons, banner hall for armour, starry night for camp gear), with a shine sliding across it.', 'Click the picture (or Tab) to see the hero dancing in their gear.', 'Under the picture: the description and the power — Power and Speed bars for weapons, protection bars for armour.', 'New Pause menu: big square hand-painted tiles (Journal, Costumes, map style toggle, Music, Sounds, Language, Gentle mode) and Resume, Restart, Export, Save, Quit buttons.', 'The maths level is picked by spinning a combination-lock wheel.', 'Restart takes you back to your last save (press it twice).'] },
  { v: '1.8.0', k: 'ffixi', date: { fr: '15 nov. 2026', en: 'Nov 15, 2026' },
    fr: ['Le feu de camp est maintenant un équipement réutilisable, à côté de la tente : Équipement → « Allumer le feu de camp ici ». E devant pour cuisiner ou l’éteindre et le ramasser. Il ne s’éteint plus tout seul. (Un feu de camp déjà fabriqué est rangé automatiquement dans tes outils.)', 'La tente se plante pour de vrai : Équipement → « Planter la tente ici », elle reste là. E devant : dormir ou la remballer. Avec quelques blocs autour, tu peux te faire de petites maisons au bout du monde.', 'Reposer le feu ou la tente ailleurs ramasse l’ancien tout seul.', 'Journal : les onglets des quêtes pas encore commencées restent « ? ? ? » et ne révèlent plus les régions à venir.', 'Le four de la maison est vivant : les flammes dansent, la lueur respire, des étincelles montent ; la fonderie du four amélioré rougeoie et fume.'],
    en: ['The campfire is now reusable gear, next to the tent: Equipment → “Light the campfire here”. E in front to cook or put it out and pick it up. It no longer burns out by itself. (A campfire you already made is moved to your tools automatically.)', 'The tent really gets pitched: Equipment → “Pitch the tent here”, and it stays. E in front: sleep or pack it up. Add a few blocks around it and you have a little house at the end of the world.', 'Setting the fire or the tent down somewhere else picks up the old one by itself.', 'Journal: tabs for quests you haven’t started stay “? ? ?” and no longer reveal the regions ahead.', 'The house oven is alive: flames dance, the glow breathes, sparks rise; the upgraded oven’s smelter glows and smokes.'] },
  { v: '1.7.4', k: 'iix', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Abattre un arbre : chaque coup de hache le fait trembler, une entaille se creuse dans le tronc, les copeaux et les feuilles volent, puis l’arbre bascule et s’écrase au sol.', 'Casser un rocher : chaque coup de pioche le secoue, des fissures s’étendent, des éclats sautent, et à la fin il éclate en gros morceaux qui roulent.', 'Quête « La muraille » : c’est autour de TA maison (près du potager). On ne peut pas construire dans les villages, et le jeu le dit maintenant clairement.'],
    en: ['Felling a tree: every axe hit makes it shudder, a notch bites into the trunk, chips and leaves fly, then the tree topples and crashes down.', 'Breaking a boulder: every pick hit shakes it, cracks spread, shards spray, and at the end it bursts into big chunks that tumble away.', '“The Wall” quest: it’s around YOUR house (by the garden). You can’t build in villages, and the game now says so clearly.'] },
  { v: '1.7.3', k: 'ff', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Six coups d’épée différents qui s’enchaînent au hasard (jamais deux fois le même d’affilée) : coup de haut en bas, revers montant, estoc, tournoiement, frappe sautée et rafale aller-retour.', 'Les marteaux ont trois coups : frappe lourde, tournoiement et grand saut écrasant avec nuage de poussière.'],
    en: ['Six different sword swings that chain at random (never the same twice in a row): overhead chop, rising backhand, thrust, spinning slash, leaping slam and a two-hit flurry.', 'Hammers get three: heavy smash, spin, and a big leaping slam with a dust burst.'] },
  { v: '1.7.2', k: 'ii', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Carte Métro zoomée : un plan propre et net — lignes fines bordées de blanc, zones pastel par région, et une petite carte illustrée au-dessus de chaque station (un badge montre où tu as construit).', 'Sur le Métro, ta position est un anneau rouge autour de la station.'],
    en: ['Zoomed Metro map: a clean, crisp plan — slim white-edged lines, pastel zones per region, and a little picture card above every station (a badge shows where you built).', 'On the Metro, where you are is a red ring around the station.'] },
  { v: '1.7.1', k: 'i', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Course : les jambes tournent à toute vitesse, les bras battent derrière dans le vent, les cheveux volent et le visage grimace face au vent.'],
    en: ['Running: legs spin like crazy, arms flail behind in the wind, hair streams back and the face squints into the gale.'] },
  { v: '1.7.0', k: 'fff', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Chasse : une vraie animation sur toute la durée — on attrape l\'animal, on tord le cou du poulet ou on assomme les autres d\'un coup de maillet (étoiles !), puis on dépèce derrière une grosse mosaïque de pixels.', 'Si tu t\'interromps avant le coup fatal, l\'animal s\'enfuit ; après, la carcasse reste au sol (E pour reprendre). Elle pourrit au bout de 4 h et disparaît après 24 h.', 'Nouvelle nourriture : la viande avariée. Elle calme la faim mais fatigue, et ne se cuisine pas.'],
    en: ['Hunting: a real animation across the whole timer — catch the animal, wring the chicken\'s neck or stun the others with a mallet (stars!), then butcher behind a big pixel mosaic.', 'Stop before the final blow and the animal runs off; after it, the carcass stays on the ground (E to resume). It rots after 4 h and is gone after 24 h.', 'New food: spoiled meat. It eases hunger but tires you, and can\'t be cooked.'] },
  { v: '1.6.0', k: 'ifix', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Combats plus intenses : ton personnage brandit vraiment son arme (élan, frappe, accompagnement) avec une traînée de mouvement, et fente vers l\'avant.', 'Enchaîne les coups pour un combo : coup de haut en bas, revers montant, puis estoc. Les marteaux frappent plus lourd et plus lentement.', 'Chaque coup qui touche : étincelles, petit temps d\'arrêt et secousse de l\'écran.', 'Correction : la balançoire des parcs du village s\'affiche de nouveau.'],
    en: ['Fiercer fights: your character really swings the weapon (wind-up, strike, follow-through) with a motion smear and a forward lunge.', 'Chain hits into a combo: overhead chop, rising backhand, then a thrust. Hammers hit heavier and slower.', 'Every landed hit: sparks, a brief impact freeze and a little screen shake.', 'Fix: the swing in village parks shows again.'] },
  { v: '1.5.4', k: 'i', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['En cuisinant, ton personnage s\'active avec une poêle et une marmite qui bouillonne (la nourriture saute dans la poêle) au lieu de donner des coups de marteau.'],
    en: ['When cooking, your character works a frying pan and a bubbling pot (the food flips in the pan) instead of swinging a hammer.'] },
  { v: '1.5.3', k: 'xi', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Nouvelles icônes : feu de camp, établi de campagne, lanterne d\'argent, armure de coquillages, manteau de fourrure, parka de yéti, gourde, cape du vent et cape de plumes.', 'Près d\'un feu de camp, un badge « Au chaud près du feu » s\'affiche. La lanterne d\'argent remplace la lanterne dans les outils.'],
    en: ['New icons: campfire, field bench, silver lantern, shell armour, fur coat, yeti parka, flask, wind cloak and feather cloak.', 'By a campfire a “Warm by the fire” badge shows. The silver lantern replaces the lantern in your tools.'] },
  { v: '1.5.2', k: 'i', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Carte du monde : quand le lieu choisi est celui où tu te trouves, c\'est le X qui pulse (plus de cercle en double).'],
    en: ['World map: when the selected place is where you are, the X itself pulses (no more double circle).'] },
  { v: '1.5.1', k: 'xx', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Carte du monde : cliquer ou toucher un endroit zoome bien à cet endroit (le zoom ne file plus vers le coin en haut à gauche).', 'Le morceau de carte « sous la maison » et son chemin restent cachés tant que tu n\'y es pas allé.'],
    en: ['World map: clicking or tapping a spot zooms right there (no more drifting to the top-left corner).', 'The “under the house” map piece and its road stay hidden until you have been there.'] },
  { v: '1.5.0', k: 'ffi', date: { fr: '14 nov. 2026', en: 'Nov 14, 2026' },
    fr: ['Carte du monde, de près : chaque lieu devient une petite scène dessinée (forêts d\'arbres, champs, villages avec église, lacs avec barque, montagnes enneigées, cimetière, igloos, volcans, îles flottantes, forges, ruines…), nette à tous les zooms.', 'Tes constructions apparaissent sur la carte comme de vraies petites structures (matériaux, échelles, portes, pics, feux de camp), à leur place dans le paysage.', 'Des arbres, herbes, cailloux et fleurs garnissent les terres découvertes, et les chemins deviennent de vrais sentiers.'],
    en: ['World map up close: each place becomes a little drawn scene (forests, fields, villages with a church, lakes with a boat, snowy mountains, the cemetery, igloos, volcanoes, floating islands, forges, ruins…), sharp at every zoom.', 'Your builds show on the map as real little structures (materials, ladders, gates, spikes, campfires), right in the landscape.', 'Trees, grass, pebbles and flowers fill the discovered lands, and roads become proper paths.'] },
  { v: '1.4.1', k: 'if', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Les décors lointains se fondent dans une brume bleutée et légèrement floue : plus ils sont loin, plus ils s\'estompent.', 'Murs d\'escalade : ↓ fait redescendre, depuis le sommet comme à mi-hauteur.'],
    en: ['Faraway scenery fades into a soft, slightly blurred blue haze: the farther away, the fainter.', 'Climbing walls: ↓ climbs back down, from the top or halfway up.'] },
  { v: '1.4.0', k: 'iifx', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Décors entièrement redessinés : des montagnes éclairées et enneigées dans la brume, et un paysage propre à chaque lieu (prés et champs, villages, forêt touffue, lacs, montagnes, cimetière, Grand Nord avec aurores, volcans, îles du ciel, caverne de cristal).', 'Les rochers des montagnes ont de vraies faces, des corniches et de la mousse.', 'Murs d\'escalade : grimpe avec ↑ ↓ (ou E), saute avec Espace. Là-haut, il y a parfois un coffre avec un petit trésor (il se remplit tous les quelques jours).', 'Correction : sur l\'Autre Rive, le ravin près du hameau était invisible (caché sous l\'herbe ou sous une maison) et on tombait sans raison. Il est maintenant bien visible et rien n\'est construit par-dessus.'],
    en: ['Backgrounds fully redrawn: lit, snowy mountains in the haze, and scenery for each kind of place (meadows and fields, villages, a fluffy forest, lakes, mountains, the cemetery, the Frozen North with auroras, volcanoes, sky islands, a crystal cavern).', 'Mountain rocks have real faces, ledges and moss.', 'Climbing walls: climb with ↑ ↓ (or E), jump off with Space. Up top there is sometimes a chest with a small treasure (it restocks every few days).', 'Fix: on the Far Shore, the ravine near the hamlet was invisible (hidden under the grass or a house), so you could fall for no visible reason. It is now clearly visible and nothing is built over it.'] },
  { v: '1.3.0', k: 'fi', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Carte du monde : clique sur une région pour zoomer, puis fais glisser la carte. Molette, boutons + / −, flèches ↑ ↓ ; Échap revient à la vue d\'ensemble.', 'Les deux cartes du monde (Grand-mère et Métro) sont dessinées à la pleine résolution de l\'écran, nettes même de très près.'],
    en: ['World map: click a region to zoom in, then drag the map around. Mouse wheel, + / − buttons, ↑ ↓ arrows; Esc goes back to the overview.', 'Both world maps (Grandma and Metro) are drawn at your screen\'s full resolution, sharp even up close.'] },
  { v: '1.2.7', k: 'i', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Mini-carte : le X se déplace librement au milieu, puis pousse la carte quand il atteint le quart ou les trois quarts. On voit toujours plus du chemin parcouru.'],
    en: ['Corner map: the X moves freely in the middle, then pushes the map once it reaches a quarter or three quarters of the way. You always see more of the road behind you.'] },
  { v: '1.2.6', k: 'ix', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Cartes métro (monde et coin de l\'écran) : tracés lisses, dessinés à la pleine résolution de l\'écran.', 'Carte du monde : le bouton × n\'est plus caché par la carte.'],
    en: ['Metro maps (world and corner): smooth lines, drawn at your screen\'s full resolution.', 'World map: the × button is no longer hidden behind the map.'] },
  { v: '1.2.5', k: 'ii', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Mini-carte : 50 % plus large, ton personnage reste au centre et la carte défile en douceur.', 'Le bout de carte de la maison (et la coupure) se place à gauche ou à droite selon où se trouve la maison.'],
    en: ['Corner map: 50% wider, your character stays in the middle and the map scrolls smoothly.', 'The house scrap (and the break) sits on the left or right depending on where the house is.'] },
  { v: '1.2.4', k: 'i', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Nouvelles icônes pour le marteau, la pioche, le marteau de guerre, la canne à pêche et les épées : les têtes sont enfin bien droites sur les manches.'],
    en: ['New icons for the hammer, pickaxe, war hammer, fishing rod and swords: heads now sit square on their handles.'] },
  { v: '1.2.3', k: 'x', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Carte de Grand-mère : les zones inconnues ne scintillent plus.'],
    en: ['Grandma\'s map: unknown areas no longer flicker.'] },
  { v: '1.2.2', k: 'x', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Coffre et inventaire : on ne voit plus les objets pas encore découverts, seulement ce que tu portes.'],
    en: ['Chest and inventory: items you have not found yet are no longer shown, only what you carry.'] },
  { v: '1.2.1', k: 'i', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Coffre : choisir une pile ouvre une petite fenêtre pour choisir combien déplacer (− / +, Tout, maintiens ← → pour aller vite). Fini de tout vider d\'un coup.'],
    en: ['Chest: picking a stack opens a small window to choose how many to move (− / +, All, hold ← → to go fast). No more dumping everything at once.'] },
  { v: '1.2.0', k: 'bfbb', date: { fr: '13 nov. 2026', en: 'Nov 13, 2026' },
    fr: ['Plus de porte à construire ni à réparer : fini la porte abîmée pendant que tu explores.',
         'Le potager de Grand-mère, à côté de la maison, donne des légumes chaque matin (E pour récolter).',
         'Les hordes ne viennent que les nuits où tu es à la maison. Si elles restent jusqu\'à l\'aube, elles piétinent le potager.',
         'Replante une rangée piétinée pour 2 bois. La muraille (F7) protège le potager une nuit sur deux.'],
    en: ['No more door to build or repair, and no more door getting damaged while you explore.',
         'Grandma\'s vegetable garden next to the house grows vegetables every morning (E to harvest).',
         'Hordes only come on nights you are home. If they are still there at dawn, they trample the garden.',
         'Replant a trampled row for 2 wood. The wall (F7) shields the garden every other night.'] },
  { v: '1.1.1', k: 'i', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Grande carte : les noms des lieux et des pays sont plus gros et bien lisibles, avec un léger halo de parchemin.'],
    en: ['World map: place and land names are bigger and easy to read, with a soft parchment halo.'] },
  { v: '1.1.0', k: 'ffffii', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['La carte de grand-mère ! En haut à gauche, un bout de vieille carte déchirée montre les lieux autour de toi, peints à la main. Loin de la maison, la carte se déchire : la maison reste sur un petit morceau, et la déchirure dit combien de lieux il y a entre les deux.', 'Touche la petite carte (ou appuie sur M) pour ouvrir la grande : une vieille carte au trésor qui flotte, avec le pourcentage du monde découvert, pays par pays. Chaque nouveau lieu s’ajoute tout de suite ; chaque nouveau pays vient se recoudre au-dessus.', 'Tes constructions apparaissent en tout petit sur les cartes, à côté des lieux.', 'Deuxième style au choix dans la pause : le plan de métro, net et coloré, avec les mêmes informations.', 'Manette : Share (ou le pavé tactile) ouvre la carte, L1 le journal, Options la pause.', 'Le badge de climat passe sous la carte ; le menu pause tient toujours dans l’écran.'],
    en: ['Grandma’s map! Top left, a scrap of torn old map shows the places around you, painted by hand. Far from home the map tears: home stays on a little scrap, and the tear says how many places lie between.', 'Tap the little map (or press M) to open the big one: a floating old treasure map with how much of the world you have found, land by land. Each new place is added right away; each new land gets stitched on above.', 'Your buildings show up, very tiny, on the maps next to their places.', 'A second style to choose in the pause menu: the metro map, clean and colourful, with the same information.', 'Gamepad: Share (or the touchpad) opens the map, L1 the journal, Options the pause menu.', 'The climate badge moves under the map; the pause menu always fits on screen.'] },
  { v: '1.0.6', k: 'xbbxix', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Correction importante : échanger au marché pouvait figer tout le jeu. Réparé, et si une erreur arrive un jour, le jeu ferme la fenêtre et continue au lieu de se figer.', 'Les ravins, les rivières de lave et les trous entre les îles du ciel sont de vrais trous : on y tombe s’il n’y a pas de pont (avant, on marchait dans le vide).', 'Au-dessus d’un trou sans pont, l’élan de la course, le double saut et la cape à plumes ne suffisent plus : il faut construire un pont.', 'Les quêtes de pont (le ravin du hameau, la rivière de lave, les îles du ciel) comptent un pont complet.', 'Après une chute, tu reviens sur le bord, un peu en arrière.', 'Les petits bateaux flottent sur l’eau, sous le ponton, au lieu d’être posés dessus.'],
    en: ['Important fix: trading at a market could freeze the whole game. Fixed, and if an error ever happens, the game closes the window and carries on instead of freezing.', 'Ravines, lava rivers and the gaps between the sky islands are real holes now: you fall in if there is no bridge (before, you walked on thin air).', 'Over an unbridged gap, running momentum, the double jump and the feathered cloak are no longer enough: build a bridge.', 'Bridge quests (the hamlet ravine, the lava river, the sky islands) count a finished bridge.', 'After a fall, you are put back on the bank, a little way back.', 'The little boats float on the water under the pier instead of sitting on top of it.'] },
  { v: '1.0.5', k: 'ffi', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Courir : appuie deux fois sur une flèche et garde-la enfoncée. 2,5 fois plus vite, mais trois fois plus fatigant. Impossible sous 15 % d’énergie.', 'Esquiver : près d’un monstre, appuie deux fois vite sur une flèche. Un bond de trois blocs en 0,3 s, pendant lequel rien ne te touche. Petit temps de recharge.', 'Garde la flèche enfoncée après l’esquive pour enchaîner en courant.'],
    en: ['Run: press an arrow twice and hold it. 2.5× faster, but three times as tiring. Not below 15% energy.', 'Dodge: near a monster, press an arrow twice quickly. A three-block dash in 0.3 s during which nothing can hit you. Short cooldown.', 'Keep holding the arrow after a dodge to break into a run.'] },
  { v: '1.0.4', k: 'fiix', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Nouvel inventaire : tous tes objets d’un coup d’œil à gauche (matériaux, outils, nourriture), et à droite une grande image peinte de l’objet choisi avec sa description.', 'De vrais dessins pour les trésors des pays : coquillage, peau, or, argent, fiole, fourrure, glace, ivoire, braise, écaille, poudre, plume, gelée, cœur de pierre, rafale en bouteille, nuage, charge et clé, et le ragoût.', 'Descriptions pour la pierre, le bois, la toile et le métal.', 'Téléphone : correction d’un grand cadre brun qui couvrait l’écran quand une fenêtre était ouverte.'],
    en: ['New inventory: all your items at a glance on the left (materials, tools, food), and on the right a large painted picture of the chosen item with its description.', 'Real drawings for the treasures of the lands: shell, hide, gold, silver, bottle, fur, ice, ivory, ember, scale, powder, feather, jelly, stone heart, bottled gust, cloud, charge and key, and the stew.', 'Descriptions for stone, wood, web and metal.', 'Phone: fixed a large brown frame that covered the screen while a window was open.'] },
  { v: '1.0.3', k: 'xiixxxii', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Téléphone : les boutons à l’écran se cachent quand une fenêtre est ouverte (sauf pause), pour ne plus couvrir les flèches et les cases.', 'Téléphone : on tourne les pages de Mon Histoire et du bestiaire en touchant ◀ ▶, et on fait défiler le journal avec ▲ ▼.', 'Téléphone : dans l’inventaire, touche un objet puis une case de la barre pour l’y mettre.', 'Le monde se met à jour tout de suite quand une quête s’ouvre ou se termine (panneaux, camp des brigands, tas de bois…), au réveil et à chaque nouveau jour.', 'Le troll vaincu part bouder pour de vrai, et revient le lendemain.', 'Plus de caillou par terre pile devant le troll ou une autre chose à utiliser.', 'Le lance-pierres dit bien que chaque tir coûte une pierre.', 'Une pierre savante déjà résolue au cœur répond « rien ici ».'],
    en: ['Phone: the on-screen buttons hide while a window is open (except pause), so they no longer cover arrows and slots.', 'Phone: turn the pages of My Story and the bestiary by tapping ◀ ▶, and scroll the journal with ▲ ▼.', 'Phone: in the inventory, tap an item then a bar slot to put it there.', 'The world updates right away when a quest opens or finishes (boards, the brigand camp, the woodpile…), on waking and each new day.', 'A beaten troll really goes off to sulk, and comes back the next day.', 'No more loose stone lying right in front of the troll or another thing to use.', 'The rock thrower now says each shot costs a stone.', 'A solved scholar’s stone in the Heart now says there is nothing more.'] },
  { v: '1.0.2', k: 'ix', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Le livre Mon Histoire et le bestiaire s’ouvrent avec E depuis l’intérieur de la maison (avant, seulement de dehors).', 'La porte abîmée ou cassée se voit aussi de l’intérieur.'],
    en: ['The My Story book and the bestiary open with E from inside the house (before, only from outside).', 'A damaged or broken door now shows from inside too.'] },
  { v: '1.0.1', k: 'iib', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Nouvelle police claire et bien lisible pour tous les textes et les chiffres (la police pixel reste pour le titre).', 'Les pierres savantes : la question est plus grande et sans ombre.', 'Moins de gros rochers : environ un champ sur trois et une montagne sur deux.'],
    en: ['New clean, easy-to-read font for all text and numbers (the pixel font stays on the title).', 'Scholar’s stones: the question is bigger and has no shadow.', 'Fewer big boulders: about one plain in three and one mountain in two.'] },
  { v: '1.0', k: 'fffxxx', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Version stable ! Toute l’histoire se joue du premier lit jusqu’à la berceuse de la Grande Moule.', 'Villageois « ! » : dans chaque village, un habitant porte un « ! » quand une nouvelle quête l’attend. Parle-lui pour l’entendre ; elle s’inscrit au journal.', 'Les gardes du village : après « Le toit percé » (ou dès le jour 20 en Survie), deux gardes défendent la maison pendant les sièges. Avec la bannière du Grand Siège, ils descendent aussi au cœur de la Mine-Moule.', 'Les monstres n’apparaissent plus à l’intérieur d’un abri que tu as construit.', 'Téléphone : le bouton F est passé dans la marge et ne cache plus la croix des fenêtres ni l’horloge.', 'Corrections et vérifications de toutes les versions précédentes.'],
    en: ['Stable release! The whole story plays from the first bed to the Great Mussel’s lullaby.', '“!” villagers: in each village, one villager wears a “!” when a new quest is waiting. Talk to them to hear it; it goes into the journal.', 'Village guards: after “The leaking roof” (or from day 20 in Survival), two guards defend the house during sieges. With the Grand Siege banner, they also come down to the heart of the Mine-Moule.', 'Monsters no longer appear inside a shelter you built.', 'Phone: the F button moved into the margin and no longer covers window close buttons or the clock.', 'Fixes and checks across all earlier versions.'] },
  { v: '0.8', k: 'fbffffi', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Le Cœur de la Mine-Moule : quand les quatre grandes quêtes sont finies, le puits de la cave descend au cœur.', 'Salle des Savants : trois pierres savantes plus difficiles ferment le passage.', 'Salle des climats : froid, chaleur et vent en une seule salle ; il faut les trois tenues.', 'Salle du siège : huit monstres de tous les pays à vaincre avant d’avancer.', 'La Grande Moule : à moitié de sa vie, elle ne peut plus être blessée. Joue-lui la berceuse des Savants (boîte à musique + trois sceaux) et elle s’endort.', 'Générique de fin sous le ciel étoilé, puis le monde continue. Nouveau costume : le Savant.', 'Le cœur a maintenant un vrai fond de caverne : stalactites et cristaux, plus de soleil.'],
    en: ['The Heart of the Mine-Moule: once the four great quests are done, the cellar shaft leads down to the heart.', 'Hall of Scholars: three harder scholar’s stones close the way.', 'Hall of Climates: cold, heat and wind in one hall; you need all three outfits.', 'Hall of the Siege: eight monsters from every land to beat before going on.', 'The Great Mussel: at half her life she can no longer be hurt. Play her the Scholars’ lullaby (music box + three seals) and she falls asleep.', 'End credits under the starry sky, then the world carries on. New costume: the Scholar.', 'The heart now has a real cavern backdrop: stalactites and crystals, no more sun.'] },
  { v: '0.7', k: 'ffffi', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['La fourche au bout du Nord s’ouvre quand le Roi du Givre est vaincu : à gauche les Terres Brûlées, à droite les Îles du Ciel.', 'Terres Brûlées : chaleur (gourde fraîche), rivières de lave à franchir sur un pont lié au métal (la toile brûle), diablotins qui brûlent le bois, salamandres, golems d’obsidienne, scarabées-bombes, la forge noire et la lame d’obsidienne.', 'Îles du Ciel : vent et rafales (cape du vent, puis cape à plumes pour tomber doucement), îles au-dessus du vide, harpies, méduses des nuages, gargouilles la nuit, esprits du vent à attraper en bouteille (un double saut), les harpes du vent.', 'Le Seigneur des Braises et la Reine des Vents gardent les deux derniers sceaux.', 'Chaque terre a sa couleur de musique, son village, ses échanges et son lit.'],
    en: ['The fork at the end of the North opens once the Frost King is beaten: the Badlands to the left, the Sky Islands to the right.', 'Badlands: heat (water flask), lava rivers to cross on a metal-bound bridge (web burns), imps that burn wood, salamanders, obsidian golems, bomb beetles, the black forge and the obsidian blade.', 'Sky Islands: wind and gusts (wind cloak, then the feathered cloak for gentle falls), islands over the void, harpies, cloud jellyfish, gargoyles at night, gust sprites to catch in a bottle (one double jump), the wind harps.', 'The Lord of Embers and the Queen of Winds guard the last two seals.', 'Each land has its own music colour, village, trades and bed.'] },
  { v: '0.6', k: 'fffffff', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Le Grand Nord : la seconde traversée (clé de fer + pierre difficile) au bout de l’Autre Rive mène à 12 environnements de neige, un village d’igloos, un trou de pêche et la salle de glace.', 'Le froid fatigue : fabrique le manteau de fourrure (puis la parka de yéti), reste près d’un feu ou à l’abri. Il n’y a pas de froid à l’intérieur.', 'Emplacement de tenue : une tenue à la fois, à choisir dans l’équipement (F).', 'Yétis, bonshommes de neige maudits (qui se reconstruisent), manchots glisseurs, morse grognon.', 'Blocs de neige : creuse la neige, bâtis un igloo. Ils fondent hors du Nord.', 'Le Roi du Givre, premier grand combat : il lance des éclats de glace. Sa couronne est le premier sceau.', 'Les villages du Nord prêtent un lit : tu y reviens si tu tombes.'],
    en: ['The Frozen North: the second crossing (iron key + hard stone) at the end of the Far Shore leads to 12 snowy environments, an igloo village, a fishing hole and the ice hall.', 'Cold tires you: craft the fur coat (then the yeti parka), stay near a fire or in shelter. There is no cold indoors.', 'Outfit slot: one outfit at a time, chosen in the equipment panel (F).', 'Yetis, cursed snowmen (who rebuild themselves), sliding penguins, the grumpy walrus.', 'Snow blocks: dig snow, build an igloo. They melt outside the North.', 'The Frost King, the first great fight: he throws ice shards. His crown is the first seal.', 'Northern villages lend you a bed: you wake there if you fall.'] },
  { v: '0.5', k: 'fffffbfff', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Mode Histoire : 62 quêtes en quatre voies (Le Foyer, Les Profondeurs, Le Large, Les Climats), qui s’ouvrent les unes après les autres. Journal avec J ou dans le menu pause.', 'Mon Histoire : le livre sur la table de chevet écrit une page illustrée pour chaque quête finie, avec une grande lettrine.', 'Le troll de la Traversée garde un pont au-dessus d’un ravin : réponds à sa pierre savante pour passer. Ensuite, il fait du commerce.', 'Pierres savantes partout : du calcul selon ton niveau (1 à 6, choisi à la nouvelle partie, modifiable en pause), un pavé numérique, lecture à voix haute pour les petits niveaux. Trésors à la clé.', 'Nouveaux monstres : loups en meute, spectres la nuit, corbeaux voleurs, sangliers qui chargent, crabes-boucliers, coffres-croqueurs, et le camp du chef des brigands avec sa clé de fer.', 'Les monstres sont plus forts loin de la maison et au fil des semaines (avec un plafond).', 'Le bestiaire de grand-mère : une planche peinte et une page pour chaque monstre vaincu.', 'Panneaux de village (livraisons, coches), colporteur, chiot, feu de camp, établi de campagne, armure de carapace, lanterne d’argent, ragoût copieux, or.', 'Le hameau derrière le ravin, la bibliothèque engloutie et ses 7 pierres, et le Grand Siège de 3 nuits.'],
    en: ['Story mode: 62 quests in four lanes (Home, The Depths, The Far Shore, The Lands) that open one after another. Journal with J or from the pause menu.', 'My Story: the book on the bedside table writes an illustrated page for every quest you finish, with a big drop capital.', 'The troll of the Crossing guards a bridge over a ravine: answer his scholar’s stone to pass. Afterwards he trades.', 'Scholar’s stones everywhere: maths at your level (1 to 6, chosen at New Game, changeable in pause), a number pad, read-aloud for young levels. Treasure as the reward.', 'New monsters: wolf packs, wraiths at night, thief crows, charging boars, shield crabs, mimic chests, and the brigand chief’s camp with his iron key.', 'Monsters are stronger far from home and as the weeks go by (with a cap).', 'Grandma’s bestiary: a painted plate and a page for every monster you beat.', 'Village boards (deliveries, coaches), the pedlar, the pup, campfire, field bench, shell armour, silver lantern, hearty stew, gold.', 'The hamlet beyond the ravine, the sunken library and its 7 stones, and the 3-night Grand Siege.'] },
  { v: '0.4', k: 'ffbffffif', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Combat d’action : S (ou ⚔ sur l’écran, R1 à la manette) pour frapper. Les monstres préparent leurs coups et foncent parfois sur toi ; tu peux esquiver, reculer, sauter. Recul et clignotement après un coup.', 'Le lance-pierres vise et utilise une pierre par tir. Nouveau marteau de guerre (métal 3, bois 1) : coups contondants.', 'Faiblesses : les coups contondants font 1,5× plus de dégâts aux squelettes, zombies et araignées ; les lames aux brigands et gobelins.', 'Mode doux dans le menu pause : les monstres font moitié moins mal.', 'Construction en pleine nature : lie un bloc avec de la toile (ou du métal) et il tient de côté. Toits, corniches, ponts, tours jusqu’à 8 de haut.', 'Nouveaux éléments : échelle, porte sauvage, pieux, piège de toile. Les araignées grimpent jusqu’à 3 de haut, pas plus.', 'Abris : des murs, un toit, ta tente à l’intérieur, et c’est un lit. Tu y dors en sûreté et tu y reviens si tu tombes.', 'La barre rapide se règle dans l’inventaire (A, puis 1 à 5).', 'Nouvelle partie : choisis Histoire ou Survie. Les anciennes parties sont en Survie.'],
    en: ['Action combat: S (or ⚔ on screen, R1 on a gamepad) to strike. Monsters wind up their blows and sometimes rush you; dodge, back off, jump. Knockback and a blink after a hit.', 'The rock thrower aims and uses one stone per shot. New war hammer (metal 3, wood 1): blunt blows.', 'Weaknesses: blunt blows do 1.5× damage to skeletons, zombies and spiders; blades to brigands and goblins.', 'Gentle mode in the pause menu: monsters hurt half as much.', 'Building in the wild: bind a block with web (or metal) and it holds sideways. Roofs, ledges, bridges, towers up to 8 high.', 'New pieces: ladder, wild door, spikes, web trap. Spiders climb up to 3 high, no more.', 'Shelters: walls, a roof, your tent inside, and it is a bed. Sleep there safely and wake there if you fall.', 'The quick bar is set in the inventory (A, then 1 to 5).', 'New game: choose Story or Survival. Older games are Survival.'] },
  { v: '0.3', k: 'fffff', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Garde ↓ enfoncé 3 secondes, immobile et sans monstre en vue : le héros danse sur la musique.', 'Nouvelles animations : hache pour les arbres, pioche pour la pierre et le minerai, marteau à l’établi et en construisant, on se penche pour ramasser, la main à la bouche pour manger.', 'Un mur fissuré à gauche de l’établi : casse-le à la pioche pour trouver la salle d’arcade, avec trois bornes (Kick la Banane, La Mort aux Trousses, BlocSauteur). Approche-toi et appuie sur E.', 'Certaines grottes cachent une salle secrète derrière une paroi fissurée : un juke-box qui joue toutes les chansons, ou un dragon de pierre couché sur un trésor.', 'Pause : « Exporter la sauvegarde » enregistre ton monde dans un fichier. Écran titre : « Importer » le remet dans une case libre. Le jeu demande aussi au navigateur de garder ses données.'],
    en: ['Hold ↓ for 3 seconds, standing still with no monster in sight: the hero dances to the music.', 'New animations: an axe for trees, a pickaxe for stone and ore, a hammer at the workbench and when building, bending down to pick things up, hand to mouth when eating.', 'A cracked wall left of the workbench: break it with the pickaxe to find the arcade room, with three cabinets (Kick la Banane, La Mort aux Trousses, BlocSauteur). Walk up and press E.', 'Some caves hide a secret room behind a cracked wall: a jukebox that plays every song, or a stone dragon asleep on treasure.', 'Pause: "Export save" writes your world to a file. Title screen: "Import" puts it back in a free slot. The game also asks the browser to keep its data.'] },
  { v: '0.2', k: 'fff', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Numéro de version et journal des nouveautés sur l’écran titre (clique sur la version ou appuie sur V).', 'Tas de bois à côté de chaque maison de village : 2 bois à la main. Ils se remplissent chaque jour en automne, tous les 3 jours en été et au printemps, et plus du tout en hiver.', 'Une bûche au sol dans chaque forêt : 2 bois à la main, elle revient après 3 jours.'],
    en: ['Version number and a what’s-new log on the title screen (click the version or press V).', 'A woodpile beside every village house: 2 wood by hand. Piles refill every day in autumn, every 3 days in summer and spring, and not at all in winter.', 'One fallen log in every forest: 2 wood by hand, back after 3 days.'] },
];
