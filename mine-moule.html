<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mine-Moule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;background:#000}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;background:rgba(42,27,18,.55);border:2px solid rgba(243,230,196,.6);color:#f3e6c4;font:700 22px 'Pixelify Sans',monospace;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box}
.tb.on{background:rgba(255,210,63,.55)}
.tb.big{width:78px;height:78px;font-size:26px}
.tb.sm{width:44px;height:44px;font-size:18px;border-radius:10px}
#tL{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(110px + env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px))}
#tD{left:calc(62px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#tJ{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#tE{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#tF{left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:44px;height:44px;font-size:17px;border-radius:10px}
#tS{right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#tA{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}
#tP{right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,2,.55);padding:16px;box-sizing:border-box}
#modal[hidden]{display:none}
.panel{background:#2a1b12;border:4px solid #0e0805;box-shadow:inset 0 0 0 3px #6b4a2e;color:#f3e6c4;font:500 16px 'Pixelify Sans',monospace;padding:22px 24px;width:min(460px,100%);box-sizing:border-box;max-height:100%;overflow:auto}
.panel h2{margin:0 0 14px;font-size:26px;color:#ffd23f;letter-spacing:.03em}
.panel label.f{display:block;margin:10px 0 6px;color:#c9b48a;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.panel input[type=text]{width:100%;box-sizing:border-box;font:700 20px 'Pixelify Sans',monospace;background:#f3e6c4;color:#2a1b12;border:3px solid #0e0805;padding:8px 10px;outline:none}
.panel input[type=text]:focus{box-shadow:0 0 0 3px #ffd23f}
.panel fieldset{border:0;padding:0;margin:10px 0 0}
.panel legend{color:#c9b48a;font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;padding:7px 11px;background:#3b2618;border:2px solid #0e0805;box-shadow:inset 0 0 0 2px #5a3b24}
.opts input:checked+span{background:#ffd23f;color:#2a1b12;box-shadow:none}
.opts input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.row button{font:700 17px 'Pixelify Sans',monospace;padding:9px 16px;border:3px solid #0e0805;cursor:pointer;background:#5a3b24;color:#f3e6c4}
.row button.go{background:#ffd23f;color:#2a1b12}
.row button:focus-visible{outline:2px solid #fff;outline-offset:2px}

<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div class="tb" id="tL" data-act="left">◀</div>
  <div class="tb" id="tR" data-act="right">▶</div>
  <div class="tb" id="tD" data-act="down">▼</div>
  <div class="tb big" id="tJ" data-act="up">▲</div>
  <div class="tb" id="tE" data-act="use">E</div>
  <div class="tb" id="tF" data-act="equip">F</div>
  <div class="tb big" id="tS" data-act="atk">⚔</div>
  <div class="tb" id="tA" data-act="inv">A</div>
  <div class="tb sm" id="tP" data-act="pause">II</div>
</div>

    <h2 id="ngTitle">Nouvelle partie</h2>
    <label class="f" for="ngName" id="ngNameL">Nom</label>
    <input type="text" id="ngName" maxlength="16" value="Oggy">
    <fieldset><legend id="ngFlavorL">Monde</legend><div class="opts" id="ngFlavor"></div></fieldset>
    <fieldset><legend id="ngLenL">Saisons</legend><div class="opts" id="ngLen"></div></fieldset>
    <fieldset><legend id="ngModeL">Mode</legend><div class="opts" id="ngMode"></div></fieldset>
    <fieldset><legend id="ngGradeL">Maths</legend><div class="opts" id="ngGrade"></div></fieldset>
    <div class="row"><button type="button" id="ngCancel">Annuler</button><button type="submit" class="go" id="ngStart">Commencer</button></div>
  </form>
</div>

'use strict';
// ════════════════════════════════════════════════════════════════════
// MINE-MOULE — a retro survival side-scroller. One file, no build step.
// Logical screen 960×540, blitted with nearest-neighbour (whole-number

const W = 960, H = 540, TB = 38, BY = 470, GY = 356, TW = 960;
const DEBUG = /[?&]debug/.test(location.search);
const FONT = '"Pixelify Sans", ui-monospace, monospace';
const cv = document.getElementById('c'), vctx = cv.getContext('2d');
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').imageSmoothingEnabled = false; return c; }
const buf = mkC(W, H), ctx = buf.getContext('2d');
const landC = mkC(W, H), landX = landC.getContext('2d');
const VIEW = { x: 0, y: 0, s: 1, w: W, h: H, dpr: 1 };
function layout() {
  const dpr = window.devicePixelRatio || 1, cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
  cv.width = cw; cv.height = ch;
  const fit = Math.min(cw / W, ch / H), fl = Math.floor(fit);
  const s = (fl >= 2 && fl / fit >= 0.8) ? fl : fit;
  Object.assign(VIEW, { s, w: Math.round(W * s), h: Math.round(H * s), dpr });
  VIEW.x = Math.floor((cw - VIEW.w) / 2); VIEW.y = Math.floor((ch - VIEW.h) / 2);
  vctx.imageSmoothingEnabled = false;
}
addEventListener('resize', layout); layout();

function rng(seed) { let a = seed >>> 0; return function () { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash() { let h = 2166136261 >>> 0; for (let i = 0; i < arguments.length; i++) { h ^= arguments[i] | 0; h = Math.imul(h, 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; } return h >>> 0; }
const hr = function () { return hash.apply(null, arguments) / 4294967296; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function R(x, X, Y, w, h, c) { x.fillStyle = c; x.fillRect(Math.round(X), Math.round(Y), Math.round(w), Math.round(h)); }
function disc(x, cx, cy, r, c) { x.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); r = Math.max(1, Math.round(r)); for (let j = -r; j <= r; j++) { const hw = Math.round(Math.sqrt(r * r - j * j)); x.fillRect(cx - hw, cy + j, hw * 2 + 1, 1); } }
function ell(x, cx, cy, rx, ry, c, maxY) { x.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let j = -ry; j <= ry; j++) { const y = cy + j; if (maxY != null && y > maxY) continue; const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (j / ry) * (j / ry)))); x.fillRect(cx - hw, y, hw * 2 + 1, 1); } }
function glow(x, cx, cy, r, c, a) { if (a <= 0.003) return; x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = a; for (let k = 3; k >= 1; k--) disc(x, cx, cy, r * k / 3, c); x.restore(); }
function text(x, s, X, Y, size, col, align, weight, shadow) {
  x.font = (weight || 700) + ' ' + size + 'px ' + FONT; x.textAlign = align || 'left'; x.textBaseline = 'middle';
  if (shadow) { x.fillStyle = shadow; x.fillText(s, Math.round(X) + 2, Math.round(Y) + 2); }
  x.fillStyle = col; x.fillText(s, Math.round(X), Math.round(Y));
}
function wrap(x, s, maxW, size) { x.font = '500 ' + size + 'px ' + FONT; const words = s.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }

Object.assign(STR.fr, { capHit: 'Trop de blocs ici.', snowMelts: 'La neige fondrait ici.', needBind: 'Il faut de la toile (ou du métal) pour lier ce bloc.', tooFarSpan: 'Trop loin d’un appui.', bindHint: 'Bloc lié avec de la toile ! Il tient de côté.', assignHint: 'appuie sur 1 à 5 pour le mettre dans la barre', fellGap: 'Aïe ! Une belle chute…', shelterSleep: 'Bien à l’abri pour la nuit.', shelterSet: 'Ton abri est maintenant ton lit.' });

const VERSION = '0.8';
const CHANGELOG = [
  { v: '0.8', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Le Cœur de la Mine-Moule : quand les quatre grandes quêtes sont finies, le puits de la cave descend au cœur.', 'Salle des Savants : trois pierres savantes plus difficiles ferment le passage.', 'Salle des climats : froid, chaleur et vent en une seule salle ; il faut les trois tenues.', 'Salle du siège : huit monstres de tous les pays à vaincre avant d’avancer.', 'La Grande Moule : à moitié de sa vie, elle ne peut plus être blessée. Joue-lui la berceuse des Savants (boîte à musique + trois sceaux) et elle s’endort.', 'Générique de fin sous le ciel étoilé, puis le monde continue. Nouveau costume : le Savant.', 'Le cœur a maintenant un vrai fond de caverne : stalactites et cristaux, plus de soleil.'],
    en: ['The Heart of the Mine-Moule: once the four great quests are done, the cellar shaft leads down to the heart.', 'Hall of Scholars: three harder scholar’s stones close the way.', 'Hall of Climates: cold, heat and wind in one hall; you need all three outfits.', 'Hall of the Siege: eight monsters from every land to beat before going on.', 'The Great Mussel: at half her life she can no longer be hurt. Play her the Scholars’ lullaby (music box + three seals) and she falls asleep.', 'End credits under the starry sky, then the world carries on. New costume: the Scholar.', 'The heart now has a real cavern backdrop: stalactites and crystals, no more sun.'] },
  { v: '0.7', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['La fourche au bout du Nord s’ouvre quand le Roi du Givre est vaincu : à gauche les Terres Brûlées, à droite les Îles du Ciel.', 'Terres Brûlées : chaleur (gourde fraîche), rivières de lave à franchir sur un pont lié au métal (la toile brûle), diablotins qui brûlent le bois, salamandres, golems d’obsidienne, scarabées-bombes, la forge noire et la lame d’obsidienne.', 'Îles du Ciel : vent et rafales (cape du vent, puis cape à plumes pour tomber doucement), îles au-dessus du vide, harpies, méduses des nuages, gargouilles la nuit, esprits du vent à attraper en bouteille (un double saut), les harpes du vent.', 'Le Seigneur des Braises et la Reine des Vents gardent les deux derniers sceaux.', 'Chaque terre a sa couleur de musique, son village, ses échanges et son lit.'],
    en: ['The fork at the end of the North opens once the Frost King is beaten: the Badlands to the left, the Sky Islands to the right.', 'Badlands: heat (water flask), lava rivers to cross on a metal-bound bridge (web burns), imps that burn wood, salamanders, obsidian golems, bomb beetles, the black forge and the obsidian blade.', 'Sky Islands: wind and gusts (wind cloak, then the feathered cloak for gentle falls), islands over the void, harpies, cloud jellyfish, gargoyles at night, gust sprites to catch in a bottle (one double jump), the wind harps.', 'The Lord of Embers and the Queen of Winds guard the last two seals.', 'Each land has its own music colour, village, trades and bed.'] },
  { v: '0.6', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Le Grand Nord : la seconde traversée (clé de fer + pierre difficile) au bout de l’Autre Rive mène à 12 environnements de neige, un village d’igloos, un trou de pêche et la salle de glace.', 'Le froid fatigue : fabrique le manteau de fourrure (puis la parka de yéti), reste près d’un feu ou à l’abri. Il n’y a pas de froid à l’intérieur.', 'Emplacement de tenue : une tenue à la fois, à choisir dans l’équipement (F).', 'Yétis, bonshommes de neige maudits (qui se reconstruisent), manchots glisseurs, morse grognon.', 'Blocs de neige : creuse la neige, bâtis un igloo. Ils fondent hors du Nord.', 'Le Roi du Givre, premier grand combat : il lance des éclats de glace. Sa couronne est le premier sceau.', 'Les villages du Nord prêtent un lit : tu y reviens si tu tombes.'],
    en: ['The Frozen North: the second crossing (iron key + hard stone) at the end of the Far Shore leads to 12 snowy environments, an igloo village, a fishing hole and the ice hall.', 'Cold tires you: craft the fur coat (then the yeti parka), stay near a fire or in shelter. There is no cold indoors.', 'Outfit slot: one outfit at a time, chosen in the equipment panel (F).', 'Yetis, cursed snowmen (who rebuild themselves), sliding penguins, the grumpy walrus.', 'Snow blocks: dig snow, build an igloo. They melt outside the North.', 'The Frost King, the first great fight: he throws ice shards. His crown is the first seal.', 'Northern villages lend you a bed: you wake there if you fall.'] },
  { v: '0.5', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Mode Histoire : 62 quêtes en quatre voies (Le Foyer, Les Profondeurs, Le Large, Les Climats), qui s’ouvrent les unes après les autres. Journal avec J ou dans le menu pause.', 'Mon Histoire : le livre sur la table de chevet écrit une page illustrée pour chaque quête finie, avec une grande lettrine.', 'Le troll de la Traversée garde un pont au-dessus d’un ravin : réponds à sa pierre savante pour passer. Ensuite, il fait du commerce.', 'Pierres savantes partout : du calcul selon ton niveau (1 à 6, choisi à la nouvelle partie, modifiable en pause), un pavé numérique, lecture à voix haute pour les petits niveaux. Trésors à la clé.', 'Nouveaux monstres : loups en meute, spectres la nuit, corbeaux voleurs, sangliers qui chargent, crabes-boucliers, coffres-croqueurs, et le camp du chef des brigands avec sa clé de fer.', 'Les monstres sont plus forts loin de la maison et au fil des semaines (avec un plafond).', 'Le bestiaire de grand-mère : une planche peinte et une page pour chaque monstre vaincu.', 'Panneaux de village (livraisons, coches), colporteur, chiot, feu de camp, établi de campagne, armure de carapace, lanterne d’argent, ragoût copieux, or.', 'Le hameau derrière le ravin, la bibliothèque engloutie et ses 7 pierres, et le Grand Siège de 3 nuits.'],
    en: ['Story mode: 62 quests in four lanes (Home, The Depths, The Far Shore, The Lands) that open one after another. Journal with J or from the pause menu.', 'My Story: the book on the bedside table writes an illustrated page for every quest you finish, with a big drop capital.', 'The troll of the Crossing guards a bridge over a ravine: answer his scholar’s stone to pass. Afterwards he trades.', 'Scholar’s stones everywhere: maths at your level (1 to 6, chosen at New Game, changeable in pause), a number pad, read-aloud for young levels. Treasure as the reward.', 'New monsters: wolf packs, wraiths at night, thief crows, charging boars, shield crabs, mimic chests, and the brigand chief’s camp with his iron key.', 'Monsters are stronger far from home and as the weeks go by (with a cap).', 'Grandma’s bestiary: a painted plate and a page for every monster you beat.', 'Village boards (deliveries, coaches), the pedlar, the pup, campfire, field bench, shell armour, silver lantern, hearty stew, gold.', 'The hamlet beyond the ravine, the sunken library and its 7 stones, and the 3-night Grand Siege.'] },
  { v: '0.4', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Combat d’action : S (ou ⚔ sur l’écran, R1 à la manette) pour frapper. Les monstres préparent leurs coups et foncent parfois sur toi ; tu peux esquiver, reculer, sauter. Recul et clignotement après un coup.', 'Le lance-pierres vise et utilise une pierre par tir. Nouveau marteau de guerre (métal 3, bois 1) : coups contondants.', 'Faiblesses : les coups contondants font 1,5× plus de dégâts aux squelettes, zombies et araignées ; les lames aux brigands et gobelins.', 'Mode doux dans le menu pause : les monstres font moitié moins mal.', 'Construction en pleine nature : lie un bloc avec de la toile (ou du métal) et il tient de côté. Toits, corniches, ponts, tours jusqu’à 8 de haut.', 'Nouveaux éléments : échelle, porte sauvage, pieux, piège de toile. Les araignées grimpent jusqu’à 3 de haut, pas plus.', 'Abris : des murs, un toit, ta tente à l’intérieur, et c’est un lit. Tu y dors en sûreté et tu y reviens si tu tombes.', 'La barre rapide se règle dans l’inventaire (A, puis 1 à 5).', 'Nouvelle partie : choisis Histoire ou Survie. Les anciennes parties sont en Survie.'],
    en: ['Action combat: S (or ⚔ on screen, R1 on a gamepad) to strike. Monsters wind up their blows and sometimes rush you; dodge, back off, jump. Knockback and a blink after a hit.', 'The rock thrower aims and uses one stone per shot. New war hammer (metal 3, wood 1): blunt blows.', 'Weaknesses: blunt blows do 1.5× damage to skeletons, zombies and spiders; blades to brigands and goblins.', 'Gentle mode in the pause menu: monsters hurt half as much.', 'Building in the wild: bind a block with web (or metal) and it holds sideways. Roofs, ledges, bridges, towers up to 8 high.', 'New pieces: ladder, wild door, spikes, web trap. Spiders climb up to 3 high, no more.', 'Shelters: walls, a roof, your tent inside, and it is a bed. Sleep there safely and wake there if you fall.', 'The quick bar is set in the inventory (A, then 1 to 5).', 'New game: choose Story or Survival. Older games are Survival.'] },
  { v: '0.3', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Garde ↓ enfoncé 3 secondes, immobile et sans monstre en vue : le héros danse sur la musique.', 'Nouvelles animations : hache pour les arbres, pioche pour la pierre et le minerai, marteau à l’établi et en construisant, on se penche pour ramasser, la main à la bouche pour manger.', 'Un mur fissuré à gauche de l’établi : casse-le à la pioche pour trouver la salle d’arcade, avec trois bornes (Kick la Banane, La Mort aux Trousses, BlocSauteur). Approche-toi et appuie sur E.', 'Certaines grottes cachent une salle secrète derrière une paroi fissurée : un juke-box qui joue toutes les chansons, ou un dragon de pierre couché sur un trésor.', 'Pause : « Exporter la sauvegarde » enregistre ton monde dans un fichier. Écran titre : « Importer » le remet dans une case libre. Le jeu demande aussi au navigateur de garder ses données.'],
    en: ['Hold ↓ for 3 seconds, standing still with no monster in sight: the hero dances to the music.', 'New animations: an axe for trees, a pickaxe for stone and ore, a hammer at the workbench and when building, bending down to pick things up, hand to mouth when eating.', 'A cracked wall left of the workbench: break it with the pickaxe to find the arcade room, with three cabinets (Kick la Banane, La Mort aux Trousses, BlocSauteur). Walk up and press E.', 'Some caves hide a secret room behind a cracked wall: a jukebox that plays every song, or a stone dragon asleep on treasure.', 'Pause: "Export save" writes your world to a file. Title screen: "Import" puts it back in a free slot. The game also asks the browser to keep its data.'] },
  { v: '0.2', date: { fr: '13 novembre 2026', en: 'November 13, 2026' },
    fr: ['Numéro de version et journal des nouveautés sur l’écran titre (clique sur la version ou appuie sur V).', 'Tas de bois à côté de chaque maison de village : 2 bois à la main. Ils se remplissent chaque jour en automne, tous les 3 jours en été et au printemps, et plus du tout en hiver.', 'Une bûche au sol dans chaque forêt : 2 bois à la main, elle revient après 3 jours.'],
    en: ['Version number and a what’s-new log on the title screen (click the version or press V).', 'A woodpile beside every village house: 2 wood by hand. Piles refill every day in autumn, every 3 days in summer and spring, and not at all in winter.', 'One fallen log in every forest: 2 wood by hand, back after 3 days.'] },
];

const QDATA = {"Q":[{"id":"F1","lane":"F","name":"Un toit","needs":[],"g":{"e":"craft","id":"bed"},"n":1,"t":["Construire le lit","Build the bed"],"eff":"Village notice boards appear","sc":"home","page":["Il était une fois, au bout d'un chemin de terre, une petite maison qui n'avait jamais connu le sommeil. Ce soir-là, {nom} y assembla un lit de planches et de paille, et pour la première fois depuis grand-mère, les étoiles veillèrent sur quelqu'un.","Once upon a time, at the end of a dirt road, stood a little house that had not known sleep since Grandma left. That night {name} built a bed of planks and straw, and for the first time in years the stars kept watch over someone."]},{"id":"F2","lane":"F","name":"Bonjour voisins","needs":["F1"],"g":{"e":"trade"},"n":1,"t":["Échanger une fois dans un village","Trade once in any village"],"eff":"That village greets you and adds one trade","sc":"village","page":["Au village de {village}, les volets s'entrouvrirent sur un visage inconnu. {nom} tendit une poignée de baies et reçut en retour un sourire et une miche de pain : c'est ainsi que naissent les amitiés.","In the village of {village}, shutters creaked open on a stranger's face. {name} held out a handful of berries and got back a smile and a loaf of bread: that is how friendships begin."]},{"id":"F3","lane":"F","name":"Le bon bois","needs":["F1"],"g":{"e":"pickup","kind":"woodpile"},"n":5,"t":["Prendre 10 bois dans les tas de bois","Take 10 wood from woodpiles"],"eff":"A woodpile appears beside your house","sc":"village","page":["Les vieux tas de bois des villageois racontaient les hivers passés. {nom} en rapporta dix bûches, et le soir venu, près de la porte, un petit tas tout neuf se mit à attendre l'hiver lui aussi.","The villagers' old woodpiles told tales of winters gone by. {name} carried ten logs home, and by evening a brand-new little pile sat by the door, waiting for winter too."]},{"id":"F4","lane":"F","name":"Coffre plein","needs":["F3"],"g":{"e":"flag","f":"chestFull"},"n":1,"t":["Fabriquer un coffre et y ranger 10 objets","Craft a chest and store 10 items in it"],"eff":"+4 slots in every chest","sc":"home","page":["Un coffre, c'est une promesse faite à demain. {nom} y rangea pierres, bois et trésors, puis referma le couvercle avec le sérieux d'un roi qui met sa couronne à l'abri.","A chest is a promise made to tomorrow. {name} filled it with stones, wood and treasures, then closed the lid as solemnly as a king putting away his crown."]},{"id":"F5","lane":"F","name":"La commande","needs":["F2"],"g":{"e":"deliver","items":{"fish":5,"wood":5}},"n":1,"t":["Livrer 5 poissons et 5 bois au panneau d’un village","Deliver 5 fish and 5 wood to the F2 village"],"eff":"That village's prices drop 10 % for good","sc":"village","page":["La marchande avait promis : « Cinq poissons et cinq bûches, et je te ferai les meilleurs prix du pays ! » {nom} revint les bras chargés, et elle tint parole : à {village}, on ne marchande plus avec un ami.","The merchant had promised: \"Five fish and five logs, and I'll give you the best prices in the land!\" {name} came back with full arms, and she kept her word: in {village}, nobody haggles with a friend."]},{"id":"F6","lane":"F","name":"Soupe chaude","needs":["F4"],"g":{"e":"cook","distinct":1},"n":3,"t":["Cuisiner 3 plats différents","Cook 3 different dishes"],"eff":"New recipe: hearty stew","sc":"home","page":["Trois marmites, trois parfums, trois soirs de fête dans la petite maison. {nom} découvrit ce que savent toutes les grand-mères : une soupe chaude est une armure contre le froid.","Three pots, three smells, three cosy evenings in the little house. {name} learned what every grandmother knows: hot soup is armour against the cold."]},{"id":"F7","lane":"F","name":"La muraille","needs":["F4"],"g":{"e":"place","near":"home"},"n":10,"t":["Poser 10 blocs autour de la maison","Place 10 blocks around the house"],"eff":"Your door takes half damage","sc":"home","page":["Pierre après pierre, un mur grandit autour de la maison comme une haie de géants endormis. Cette nuit-là, quand les monstres vinrent gratter, ils trouvèrent porte close et repartirent bredouilles.","Stone by stone, a wall grew around the house like a hedge of sleeping giants. That night, when the monsters came scratching, they found the way shut and went home empty-handed."]},{"id":"F8","lane":"F","name":"Le chiot","needs":["F5","L3"],"g":{"e":"kill","mob":"wolf"},"n":2,"t":["Chasser des loups (2)","Drive wolves from a village"],"eff":"A pup lives in your yard, barks before sieges, and can follow you","sc":"forest","page":["Les loups s'enfuirent dans la forêt, mais l'un d'eux laissa derrière lui une petite boule de poils tremblante. {nom} la prit dans ses bras ; depuis, quelqu'un dans la cour aboie dès que la nuit devient méchante.","The wolves fled into the forest, but one left behind a little trembling ball of fur. {name} picked it up; ever since, someone in the yard barks whenever the night turns mean."]},{"id":"F9","lane":"F","name":"Le marché","needs":["F5"],"g":{"e":"trade","distinctV":1,"minV":4},"n":3,"t":["Échanger dans 3 villages différents","Trade in 3 different villages (each trade worth 4+ wood units)"],"eff":"A pedlar visits your yard each week","sc":"village","page":["Trois villages, trois places de marché, trois façons de dire bonjour. Bientôt, un colporteur à la charrette grinçante prit l'habitude de s'arrêter chaque semaine devant la maison de {nom}.","Three villages, three market squares, three ways of saying hello. Soon a pedlar with a squeaky cart began stopping by {name}'s house every week."]},{"id":"F10","lane":"F","name":"Le toit percé","needs":["F9","P2"],"g":{"e":"deliver","items":{"metal":5}},"n":1,"t":["Apporter 5 métal pour réparer un toit","Bring 5 metal to fix a village roof"],"eff":"That village gains a guard","sc":"village","page":["La pluie entrait chez {villageois} comme chez elle. {nom} apporta cinq plaques de métal tirées de la montagne, et le toit se mit à chanter sous l'averse au lieu de pleurer. En remerciement, le village posta une sentinelle.","The rain walked into {villager}'s house as if it owned the place. {name} brought five sheets of metal dug from the mountain, and the roof sang under the downpour instead of weeping. In thanks, the village posted a guard."]},{"id":"F11","lane":"F","name":"Tour de garde","needs":["F7"],"g":{"e":"kill","tower":1},"n":5,"t":["Abattre 5 monstres du haut d’une tour","Shoot 5 monsters from a tower"],"eff":"Tower range +30 %","sc":"home","page":["Du haut de sa tour, {nom} voyait la nuit arriver de très loin. Cinq flèches, cinq monstres qui ne reviendraient plus : la tour devint un phare, et les villageois la montraient du doigt avec fierté.","From the top of the tower, {name} could see the night coming from far away. Five arrows, five monsters that would not be back: the tower became a lighthouse, and villagers pointed at it with pride."]},{"id":"F12","lane":"F","name":"Fête au village","needs":["F10","L8","F13"],"g":{"e":"flag","f":"festival"},"n":1,"t":["Une saison (7 jours max) sans vol, avec 5 échanges","One season (7 days at most): no theft and 5 trades"],"eff":"A festival night with its own song and a gift","sc":"village","page":["Toute une saison sans un seul larcin, et les invités venus des quatre coins de l'Autre Rive. On sortit les lanternes, les violons et les gâteaux, et {nom} dansa jusqu'à ce que la lune elle-même demande grâce.","A whole season without a single theft, and guests from every corner of the Far Shore. Out came the lanterns, the fiddles and the cakes, and {name} danced until the moon itself begged for mercy."]},{"id":"F13","lane":"F","name":"Le nid du voleur","needs":["F2"],"g":{"e":"kill","mob":"crow"},"n":1,"t":["Rattraper un corbeau voleur","Follow a thief crow to its nest and take back what it stole"],"eff":"The nest holds the village's lost festival bell","sc":"forest","page":["Le corbeau voleur fila avec la cuillère d'argent de {nom}, mais {nom} le suivit d'arbre en arbre jusqu'à son nid. Là-haut, parmi les boutons et les clés perdues, brillait une cloche dorée : la cloche des fêtes du village, disparue depuis des années.","The thief crow flew off with {name}'s silver spoon, but {name} followed it from tree to tree all the way to its nest. Up there, among buttons and lost keys, gleamed a golden bell: the village's festival bell, missing for years."]},{"id":"F14","lane":"F","name":"Un abri pour la nuit","needs":["F7"],"g":{"e":"flag","f":"shelterSleep"},"n":1,"t":["Dormir dans un abri construit en pleine nature","Build a closed shelter in the wild (walls, bound roof, door), pitch the tent inside and sleep through a night"],"eff":"Shelters you build count as beds: safe sleep and a respawn point","sc":"forest","page":["Loin de la maison, la nuit tombait vite. {nom} empila des pierres, lia un toit de planches avec de la toile d'araignée, planta la tente à l'abri et ferma la petite porte. Dehors, les monstres grattèrent toute la nuit ; dedans, on dormit comme à la maison.","Far from home, night fell fast. {name} stacked stones, bound a plank roof together with spider silk, pitched the tent inside and shut the little door. Outside, the monsters scratched all night; inside, it was as cosy as home."]},{"id":"P1","lane":"P","name":"Lumière !","needs":["F1"],"g":{"e":"craft","id":"lantern"},"n":1,"t":["Fabriquer la lanterne","Craft the lantern"],"eff":"Cave mouths get a marker on the banner","sc":"cave","page":["Dans le noir des grottes, même le courage tremble. {nom} alluma sa première lanterne, et l'ombre recula d'un pas, comme surprise d'être enfin regardée en face.","In the dark of the caves, even courage trembles. {name} lit a first lantern, and the shadows stepped back, as if surprised to be looked in the eye at last."]},{"id":"P2","lane":"P","name":"Premier minerai","needs":["P1"],"g":{"e":"mine"},"n":5,"t":["Miner 5 fois du minerai","Mine 5 metal ore"],"eff":"Pickaxe swings faster","sc":"cave","page":["Toc, toc, toc ! La pioche chanta contre la roche, et la montagne, en grondant, céda cinq pépites brillantes. {nom} les tint dans la lumière comme on tient des étoiles tombées.","Tock, tock, tock! The pickaxe sang against the rock, and the grumbling mountain gave up five shining nuggets. {name} held them to the light like fallen stars."]},{"id":"P3","lane":"P","name":"Fond de grotte","needs":["P2"],"g":{"e":"reach","kind":"caveEnd"},"n":1,"t":["Atteindre le fond d’une grotte","Reach any cave end"],"eff":"A miner settles in the nearest village","sc":"cave","page":["Plus bas que les racines, plus bas que les sources, {nom} atteignit le fond de la grotte. Là, gravée dans la pierre, une main inconnue avait écrit : « Nous étions là avant vous. »","Deeper than the roots, deeper than the springs, {name} reached the bottom of the cave. There, carved in the stone, an unknown hand had written: \"We were here before you.\""]},{"id":"P4","lane":"P","name":"Pierre savante","needs":["P1"],"g":{"e":"solve","kind":"treasure"},"n":1,"t":["Résoudre une pierre savante","Solve a treasure tablet"],"eff":"Tablets you have seen show on the banner","sc":"ruin","page":["Une pierre qui pose des questions ! {nom} réfléchit, compta sur ses doigts, et la bonne réponse fit s'ouvrir un coffre caché. Les anciens mineurs, semblait-il, aimaient les énigmes plus que l'or.","A stone that asks questions! {name} thought hard, counted on fingers, and the right answer opened a hidden chest. The old miners, it seemed, loved riddles more than gold."]},{"id":"P5","lane":"P","name":"Le gobelin","needs":["P3"],"g":{"e":"kill","mob":"goblin"},"n":1,"t":["Vaincre un gobelin des grottes","Beat a cave goblin"],"eff":"Goblins drop more ore","sc":"cave","page":["Le gobelin grognait sur son tas de cailloux comme un dragon de poche. {nom} le chassa d'un coup bien placé, et il s'enfuit en abandonnant une bourse pleine de minerai.","The goblin growled over its pile of pebbles like a pocket-sized dragon. {name} chased it off with one good swing, and it fled, leaving a pouch full of ore behind."]},{"id":"P6","lane":"P","name":"Trois pierres","needs":["P4"],"g":{"e":"solve"},"n":3,"t":["Résoudre 3 pierres savantes","Solve 3 tablets"],"eff":"One hint after a wrong answer","sc":"ruin","page":["Trois pierres, trois énigmes, et chaque fois la même signature gravée : « Les Savants ». {nom} commença à se demander qui étaient ces Savants, et pourquoi leurs pierres semblaient l'attendre.","Three stones, three riddles, and each time the same carved signature: \"The Scholars\". {name} began to wonder who these Scholars were, and why their stones seemed to be waiting."]},{"id":"P7","lane":"P","name":"Salle secrète","needs":["P3"],"g":{"e":"flag","f":"secret"},"n":1,"t":["Trouver une salle secrète dans une grotte","Find a secret cave room"],"eff":"You take the music box home: it sits on the bedside table and plays any song you have heard","sc":"cave","page":["Derrière un mur qui sonnait creux dormait une salle oubliée. Une vieille boîte à musique s'y réveilla au toucher de {nom} et joua un air que personne n'avait entendu depuis cent ans. {nom} l'emporta sous le bras et la posa sur la table de chevet, à côté du livre de grand-mère.","Behind a wall that rang hollow slept a forgotten room. An old music box woke at {name}'s touch and played a tune no one had heard in a hundred years. {name} carried it home and set it on the bedside table, next to Grandma's book."]},{"id":"P8","lane":"P","name":"L'arcade","needs":["P2"],"g":{"e":"flag","f":"arcade"},"n":1,"t":["Casser le mur fissuré de la maison","Break the cracked wall at home"],"eff":"The arcade room opens (round 1)","sc":"home","page":["Un coup de pioche dans le mur de la maison, et voilà une pièce secrète pleine de lumières clignotantes ! Trois grandes machines y attendaient un joueur, et sur l'une d'elles, le tableau des records portait les initiales de grand-mère.","One swing of the pickaxe at the house wall, and behold a secret room full of blinking lights! Three great machines waited for a player, and on one of them the high-score table bore Grandma's initials."]},{"id":"P9","lane":"P","name":"Le dragon","needs":["P7"],"g":{"e":"flag","f":"dragon"},"n":1,"t":["Trouver le trésor du dragon de pierre","Find the dragon's coin room"],"eff":"A pile of coins to trade with","sc":"cave","page":["Le dragon dormait sur ses pièces d'or… mais il était de pierre, et depuis bien longtemps. {nom} lui fit une révérence polie avant de remplir ses poches, au cas où.","The dragon slept on its gold… but it was made of stone, and had been for ages. {name} bowed politely before filling both pockets, just in case."]},{"id":"P10","lane":"P","name":"Sans faute","needs":["P6","L7"],"g":{"e":"flag","f":"streak5"},"n":1,"t":["5 pierres de suite sans erreur","5 tablets in a row, no wrong answer"],"eff":"A grade badge on your save slot","sc":"ruin","page":["Le troll avait tout expliqué : les retenues, les tables, les astuces. Cinq énigmes plus tard, pas une erreur, et sur la dernière pierre apparut un mot nouveau : « Savant ». Le troll, en l'apprenant, ôta son chapeau.","The troll had explained it all: carrying, times tables, little tricks. Five riddles later, not one mistake, and on the last stone a new word appeared: \"Scholar\". When the troll heard, he took off his hat."]},{"id":"P11","lane":"P","name":"Lanterne d'argent","needs":["P5","P9","F9"],"g":{"e":"craft","id":"silverLantern"},"n":1,"t":["Améliorer la lanterne en lanterne d’argent","Upgrade the lantern"],"eff":"Light reaches twice as far","sc":"cave","page":["Le colporteur fournit l'argent, le dragon l'or, le gobelin le minerai. De tout cela, {nom} fit une lanterne si claire que la nuit, un peu honteuse, alla se cacher plus loin.","The pedlar gave the silver, the dragon the gold, the goblin the ore. From all of it {name} made a lantern so bright that the night, a little embarrassed, went to hide farther away."]},{"id":"P12","lane":"P","name":"Le Bestiaire","needs":["P3"],"g":{"e":"flag","f":"beasts3"},"n":1,"t":["Vaincre 3 sortes de monstres, puis trouver l’épée et le livre","Have 3 kinds of monster in your record (kills count from day one), then find the sword and book behind a cracked cave wall"],"eff":"Grandma's sword and bestiary hang on the wall at home; every monster you beat gets a page","sc":"cave","page":["Derrière une paroi fendue, au fond d'une grotte, dormaient une épée ornée et un gros livre relié de cuir. Sur la couverture, grand-mère avait écrit : « Bestiaire — tout ce que j'ai affronté, et comment. » {nom} accrocha l'épée au mur de la maison et posa le livre juste en dessous, prêt à accueillir de nouvelles pages.","Behind a cracked wall at the back of a cave slept an ornate sword and a big leather-bound book. On the cover Grandma had written: \"Bestiary — everything I ever faced, and how.\" {name} hung the sword on the wall at home and set the book just below it, ready for new pages."]},{"id":"P13","lane":"P","name":"Le coffre qui mord","needs":["P3","L2"],"g":{"e":"kill","mob":"mimic"},"n":1,"t":["Vaincre un coffre-croqueur","Beat a mimic chest in a cave"],"eff":"Mimics' locks glint from across the screen, and they drop better treasure","sc":"cave","page":["Le coffre était trop beau, trop bien posé, trop seul. Quand {nom} souleva le couvercle, il claqua des dents ! Une bonne bataille plus tard, le coffre-croqueur rendit son trésor, et {nom} retint la leçon pour toujours : on regarde la serrure avant d'ouvrir.","The chest was too pretty, too neatly placed, too alone. When {name} lifted the lid, it snapped its teeth! One good fight later, the mimic gave up its treasure, and {name} learned the lesson forever: look at the lock before you open."]},{"id":"L1","lane":"L","name":"Pont du troll","needs":["P4"],"g":{"e":"gate","g":"cross"},"n":1,"t":["Résoudre la pierre de la Traversée","Solve the Crossing tablet (beating the troll does not open it)"],"eff":"The Far Shore opens","sc":"bridge","page":["Le troll tonna : « Personne ne passe sans répondre ! » {nom} réfléchit, répondit juste, et le grand troll s'écarta en souriant de toutes ses dents mal rangées. Au-delà du pont, l'Autre Rive attendait.","The troll thundered: \"None shall pass without answering!\" {name} thought, answered right, and the great troll stepped aside, smiling with all his crooked teeth. Beyond the bridge, the Far Shore was waiting."]},{"id":"L2","lane":"L","name":"Premier pas","needs":["L1"],"g":{"e":"reach","kind":"arrival"},"n":1,"t":["Arriver au village de l’Autre Rive","Reach the arrival village"],"eff":"A bed in the arrival village","sc":"village","page":["Tout était plus grand de ce côté du pont : les arbres, les montagnes, les silences. Au village d'arrivée, on prêta un lit à {nom}, et l'on parla tout bas d'une chose qui gronde sous la terre, les nuits sans lune.","Everything was bigger on this side of the bridge: the trees, the mountains, the silences. In the arrival village they lent {name} a bed, and whispered of something that rumbles under the ground on moonless nights."]},{"id":"L3","lane":"L","name":"La meute","needs":["L2"],"g":{"e":"kill","mob":"wolf"},"n":3,"t":["Vaincre une meute de loups (3)","Beat a wolf pack"],"eff":"Fewer wolves in rings 1–2","sc":"forest","page":["Ils étaient trois, puis quatre, les yeux comme des braises. {nom} tint bon, dos à un arbre, jusqu'à ce que le chef de meute baisse la tête et emmène les siens loin des chemins.","There were three, then four, with eyes like embers. {name} stood firm, back to a tree, until the pack leader lowered his head and led the others away from the paths."]},{"id":"L4","lane":"L","name":"Spectres","needs":["L2","P11","P12"],"g":{"e":"kill","mob":"wraith"},"n":3,"t":["Bannir 3 spectres avec la lanterne","Banish 3 wraiths with the lantern at night"],"eff":"Fewer wraiths in rings 2–3","sc":"forest","page":["Les spectres glissaient entre les arbres comme des draps oubliés au vent. Un à un, la lanterne d'argent les dissipa, et chacun murmura en partant le même mot : « Elle se réveille… »","The wraiths drifted between the trees like sheets forgotten on a line. One by one the silver lantern dissolved them, and each whispered the same words as it went: \"She is waking…\""]},{"id":"L5","lane":"L","name":"Camp brigand","needs":["L3","L6","F8"],"g":{"e":"kill","mob":"chief"},"n":1,"t":["Vaincre le chef des brigands","Beat the brigand chief"],"eff":"Iron key; the camp becomes a waystation","sc":"forest","page":["Le chiot flaira la fumée du camp bien avant que {nom} ne la voie. Le chef des brigands se battit comme un ours, puis tomba, et dans sa poche brillait une clé de fer couverte de givre.","The pup smelled the camp's smoke long before {name} saw it. The brigand chief fought like a bear, then fell, and in his pocket gleamed an iron key covered in frost."]},{"id":"L6","lane":"L","name":"Les gardes","needs":["L2"],"g":{"e":"kill","mob":"brigand"},"n":5,"t":["Vaincre 5 brigands","Beat 5 brigands"],"eff":"Brigands flee you at low health","sc":"forest","page":["Cinq brigands, cinq bandanas, cinq leçons de politesse. Depuis, quand ils aperçoivent {nom} au détour d'un chemin, les brigands se rappellent soudain une affaire très urgente à régler ailleurs.","Five brigands, five bandanas, five lessons in manners. Ever since, when they spot {name} on the road, brigands suddenly remember something very urgent to do elsewhere."]},{"id":"L7","lane":"L","name":"Le troll ami","needs":["L1"],"g":{"e":"troll"},"n":3,"t":["Commercer 3 fois avec le troll","Trade with the troll 3 times"],"eff":"The troll sells rare goods and teaches tablet tricks","sc":"bridge","page":["Trois marchés plus tard, le troll confia son plus grand secret : il adorait les chiffres. « Les Savants me les ont appris, avant de descendre sous la terre », dit-il en essuyant une larme grosse comme une pomme.","Three trades later, the troll shared his biggest secret: he loved numbers. \"The Scholars taught me, before they went down under the ground,\" he said, wiping a tear as big as an apple."]},{"id":"L8","lane":"L","name":"Le grand tour","needs":["L2","L15"],"g":{"e":"flag","f":"visitAll"},"n":1,"t":["Visiter tous les villages de l’Autre Rive","Visit every Far Shore village"],"eff":"A map page in the journal","sc":"village","page":["{nom} visita chaque village de l'Autre Rive et dessina une carte de tout ce que ses yeux virent. Partout on l'accueillit, et partout on promit de venir danser si jamais il y avait une fête.","{name} visited every village on the Far Shore and drew a map of everything seen. Everywhere {name} was welcomed, and everywhere people promised to come and dance if there was ever a party."]},{"id":"L9","lane":"L","name":"2ᵉ traversée","needs":["L5","P6"],"g":{"e":"gate","g":"cross2"},"n":1,"t":["Clé de fer + pierre difficile à la seconde traversée","Iron key + tablet at grade + 2"],"eff":"The Frozen North opens","sc":"snow","page":["La clé de fer tourna dans une serrure gelée, et la pierre posa sa question la plus difficile. {nom} répondit, la porte s'ouvrit, et un vent blanc comme le lait souffla depuis le Grand Nord.","The iron key turned in a frozen lock, and the stone asked its hardest question. {name} answered, the gate swung open, and a wind white as milk blew in from the Frozen North."]},{"id":"L10","lane":"L","name":"Premier froid","needs":["L9","F6","L13"],"g":{"e":"craft","id":"furCoat"},"n":1,"t":["Fabriquer le manteau de fourrure","Craft the fur coat (boar hide 2, web 3) and cross the first snowfield"],"eff":"Cold drains half as fast","sc":"snow","page":["Le froid du Nord mordait comme un chien sans maître. Dans un manteau taillé dans le cuir des sangliers, le ventre plein de soupe, {nom} avança quand même, laissant derrière soi une file de pas bien décidés. Plus loin, on racontait que la fourrure des yétis tenait encore plus chaud…","The northern cold bit like a dog with no master. In a coat cut from boar hide, belly full of soup, {name} pressed on anyway, leaving a line of very determined footprints. Further on, people said yeti fur was warmer still…"]},{"id":"L11","lane":"L","name":"Les igloos","needs":["L10","L17"],"g":{"e":"flag","f":"iglooNight"},"n":1,"t":["Garder le village d’igloos une nuit contre les bonshommes de neige","Guard the igloo village from cursed snowmen for one night, then trade"],"eff":"Warm soup on the trade list; the elder opens the ice hall","sc":"snow","page":["Toute la nuit, les bonshommes de neige maudits revinrent, encore et encore, jusqu'à ce que {nom} les fasse fondre près du feu. Au matin, les anciens écoutèrent en hochant la tête. « Le Roi du Givre n'a pas toujours été cruel, dit la plus vieille. Il garde quelque chose. Ou plutôt, il le gardait. »","All night the cursed snowmen came back, again and again, until {name} melted them by the fire. In the morning the elders listened, nodding. \"The Frost King was not always cruel,\" said the eldest. \"He guards something. Or rather, he used to.\""]},{"id":"L12","lane":"L","name":"La plage aux crabes","needs":["L2"],"g":{"e":"kill","mob":"crab"},"n":3,"t":["Casser 3 crabes-boucliers","Crack 3 shield crabs and bring the shells to the village smith"],"eff":"Shell armour recipe; shell shields for the village guards","sc":"bridge","page":["Les crabes-boucliers montaient la garde sur la plage, carapace en avant. {nom} passa derrière eux, un, deux, trois, et rapporta leurs coquilles au forgeron. « De quoi faire des boucliers pour toute la garde ! » dit-il en riant.","The shield crabs stood guard on the beach, shells first. {name} slipped behind them, one, two, three, and brought their shells to the smith. \"Enough for shields for the whole guard!\" he laughed."]},{"id":"L13","lane":"L","name":"Le sanglier têtu","needs":["L2"],"g":{"e":"stun","mob":"boar"},"n":3,"t":["Faire s’assommer 3 sangliers","Make 3 boars stun themselves on trees or blocks"],"eff":"Boar hide for the fur coat","sc":"forest","page":["Le sanglier fonçait tout droit, comme toujours. {nom} attendit le dernier moment, sauta, et la bête alla saluer un chêne de tout son front. Trois sangliers étourdis plus tard, il y avait assez de cuir pour affronter le froid du Nord.","The boar charged straight ahead, as always. {name} waited until the last moment, jumped, and the beast greeted an oak tree with its whole forehead. Three dizzy boars later, there was enough hide to face the cold of the North."]},{"id":"L14","lane":"L","name":"La pêche sur glace","needs":["L10"],"g":{"e":"flag","f":"iceFish"},"n":1,"t":["Étourdir le morse et pêcher 5 poissons à son trou","Stun the grumpy walrus, then catch 5 fish at its hole while penguins slide past"],"eff":"Walrus ivory picks for the wind harps","sc":"snow","page":["Le morse grognon gardait le meilleur trou de pêche, et les manchots passaient en glissant comme des boulets. {nom} étourdit le morse d'un bon coup, esquiva la bande, et remonta cinq poissons. Le morse, en se réveillant, laissa deux défenses d'ivoire en signe de respect.","The grumpy walrus guarded the best fishing hole, and the penguins slid by like cannonballs. {name} stunned the walrus with one good blow, dodged the gang, and pulled up five fish. When the walrus woke, it left two ivory tusks as a sign of respect."]},{"id":"L15","lane":"L","name":"Le pont suspendu","needs":["L2","F14"],"g":{"e":"flag","f":"bridge15"},"n":1,"t":["Franchir le ravin avec un pont lié","Span a Far Shore ravine with a web-bound bridge"],"eff":"A shortcut to the village beyond the ravine","sc":"bridge","page":["Un ravin coupait le chemin, si profond qu'on n'en voyait pas le fond. Planche après planche, liées de toile d'araignée, {nom} lança un pont au-dessus du vide et passa de l'autre côté sans regarder en bas — enfin, presque.","A ravine cut the path, so deep you could not see the bottom. Plank after plank, bound with spider silk, {name} threw a bridge across the void and crossed without looking down — well, almost."]},{"id":"L16","lane":"L","name":"Le fort","needs":["L6","F14"],"g":{"e":"flag","f":"fortNight"},"n":1,"t":["Tenir un fort une nuit à l’anneau 2 ou plus","Build a fort with a tower, a wild door and spikes at ring 2+, sleep in it and hold it through the night siege"],"eff":"Siege monsters lose heart sooner at forts you have held","sc":"forest","page":["Sur une colline de l'Autre Rive, {nom} bâtit un petit fort : une tour, une porte solide, des pieux tout autour. Quand la nuit tomba, les monstres vinrent en nombre. Au matin, le fort tenait toujours, et une araignée boudeuse retombait pour la centième fois au pied du mur.","On a hill of the Far Shore, {name} built a little fort: a tower, a sturdy door, spikes all around. When night fell, the monsters came in force. By morning the fort still stood, and a sulky spider was sliding down the wall for the hundredth time."]},{"id":"L17","lane":"L","name":"L'igloo","needs":["L10"],"g":{"e":"flag","f":"igloo"},"n":1,"t":["Construire un igloo et y dormir","Build an igloo from snow blocks and sleep in it"],"eff":"Snow blocks unlocked; a night in your igloo restores warmth fully","sc":"snow","page":["Dans le Grand Nord, la neige elle-même devient une maison. Bloc après bloc, {nom} monta un igloo bien rond, se glissa à l'intérieur et, pour la première fois depuis la traversée, n'eut plus froid du tout.","In the Frozen North, the snow itself becomes a house. Block by block, {name} raised a nice round igloo, crawled inside and, for the first time since the crossing, was not cold at all."]},{"id":"C1","lane":"C","name":"La fourche","needs":["E3"],"g":{"e":"reach","kind":"fork"},"n":1,"t":["Atteindre la fourche","Reach the fork crossing"],"eff":"Both hard lands open","sc":"snow","page":["Au bout du Nord, le chemin se séparait en deux : à gauche, un ciel rouge de braises ; à droite, des îles qui flottaient dans les nuages. {nom} prit une grande inspiration. Il faudrait aller des deux côtés.","At the end of the North, the road split in two: to the left a sky red with embers, to the right islands floating in the clouds. {name} took a deep breath. Both ways would have to be walked."]},{"id":"C2","lane":"C","name":"Gourde fraîche","needs":["C1"],"g":{"e":"craft","id":"flask"},"n":1,"t":["Fabriquer la gourde fraîche","Craft the water flask from lava-salamander scales"],"eff":"Heat drains half as fast","sc":"lava","page":["Dans les Terres Brûlées, l'air tremblait comme au-dessus d'une marmite. Avec les écailles d'une salamandre attrapée en plein saut, {nom} façonna une gourde qui gardait l'eau fraîche, et entra dans la fournaise en sifflotant pour se donner du courage.","In the Badlands the air shimmered like the air above a cooking pot. With the scales of a salamander caught mid-leap, {name} made a flask that kept water cool, and walked into the furnace whistling for courage."]},{"id":"C3","lane":"C","name":"Rivière de lave","needs":["C2","F7"],"g":{"e":"flag","f":"lavaBridge"},"n":1,"t":["Franchir une rivière de lave sur un pont lié au métal","Bridge a lava river with metal-bound stone or obsidian blocks (web burns near lava)"],"eff":"Your lava bridges stay for good, and a shortcut opens to the Badlands village","sc":"lava","page":["La rivière de lave coulait en grognant, bien trop large pour sauter. Bloc après bloc, comme autrefois le mur autour de la maison, {nom} bâtit un pont de pierre et passa sans même roussir une semelle.","The lava river flowed with a growl, far too wide to jump. Block by block, just like the wall around the house long ago, {name} built a stone bridge and crossed without even singeing a sole."]},{"id":"C4","lane":"C","name":"Obsidienne","needs":["C3","P3"],"g":{"e":"kill","mob":"golem"},"n":1,"t":["Vaincre un golem d’obsidienne","Beat an obsidian golem, then mine 5 obsidian"],"eff":"Obsidian blocks unlocked","sc":"lava","page":["Le golem d'obsidienne barrait la carrière, lent comme la nuit et dur comme elle. Le marteau en vint à bout, et le vieux mineur avait appris à {nom} le reste : où frapper, quand s'arrêter. La roche noire céda cinq éclats parfaits.","The obsidian golem blocked the quarry, slow as night and just as hard. The hammer got the better of it, and the old miner had taught {name} the rest: where to strike, when to stop. The black rock gave up five perfect shards."]},{"id":"C5","lane":"C","name":"Diablotins","needs":["C3"],"g":{"e":"kill","mob":"imp"},"n":10,"t":["Vaincre 10 diablotins","Beat 10 fire imps"],"eff":"Imps stop raiding the Badlands village","sc":"lava","page":["Les diablotins riaient en lançant des étincelles sur le village des Terres Brûlées. Dix d'entre eux plus tard, plus personne ne riait — sauf les villageois, enfin tranquilles.","The imps cackled as they flung sparks at the Badlands village. Ten of them later, nobody was laughing — except the villagers, finally left in peace."]},{"id":"C6","lane":"C","name":"Cape du vent","needs":["C1"],"g":{"e":"craft","id":"windCloak"},"n":1,"t":["Fabriquer la cape du vent","Catch a gust sprite in a bottle and weave it into a cloak"],"eff":"Gusts push you half as far","sc":"sky","page":["Sur les Îles du Ciel, un esprit du vent aimait pousser les voyageurs dans le vide, pour rire. {nom} l'attrapa dans une bouteille et le cousit dans la doublure d'une cape : depuis, le vent souffle avec {nom}, et non plus contre.","On the Sky Islands a gust sprite liked pushing travellers off the edge, for fun. {name} caught it in a bottle and sewed it into the lining of a cloak: since then the wind blows with {name}, not against."]},{"id":"C7","lane":"C","name":"Ponts de corde","needs":["C6","F10"],"g":{"e":"flag","f":"skyBridges"},"n":1,"t":["Reconstruire 3 ponts entre les îles","Rebuild 3 rope bridges as web-bound wood spans (wood 4 + web 2 each)"],"eff":"Shortcuts between islands","sc":"sky","page":["Trois ponts de corde pendaient, déchirés, au-dessus du vide. {nom}, qui avait déjà réparé un toit sous la pluie, ne trembla pas : nœud après nœud, les îles se tendirent de nouveau la main.","Three rope bridges hung torn above the void. {name}, who had once mended a roof in the rain, did not tremble: knot after knot, the islands held hands again."]},{"id":"C8","lane":"C","name":"Plumes","needs":["C7"],"g":{"e":"kill","mob":"harpy"},"n":3,"t":["Prendre leurs plumes à 3 harpies","Take 5 big feathers from harpies"],"eff":"Slow-fall when you hold Jump","sc":"sky","page":["Les harpies fondaient du ciel pour soulever les voyageurs et les lâcher de très haut. {nom} les attendit de pied ferme et leur prit cinq grandes plumes, longues comme un bras. Avec elles, {nom} apprit à tomber doucement, comme une feuille d'automne qui prend son temps.","The harpies swooped from the sky to lift travellers and drop them from very high up. {name} stood firm and took five great feathers from them, each as long as an arm. With them {name} learned to fall gently, like an autumn leaf taking its time."]},{"id":"C9","lane":"C","name":"Le nid","needs":["C8"],"g":{"e":"reach","kind":"nest"},"n":1,"t":["Atteindre la plus haute île","Bounce on cloud jellyfish to reach the highest island"],"eff":"A view of all lands from the top","sc":"sky","page":["Pour monter tout en haut, il fallut rebondir sur le dos des méduses des nuages, une, deux, trois, comme sur des lits moelleux. Dans un nid grand comme une maison, {nom} regarda le monde : la petite maison, les villages, la mer, le Nord. Tout cela, pensa {nom}, mérite qu'on le protège.","To climb to the top, {name} had to bounce on the backs of the cloud jellyfish, one, two, three, like soft beds. From a nest as big as a house, {name} looked out over the world: the little house, the villages, the sea, the North. All of it, {name} thought, is worth protecting."]},{"id":"C10","lane":"C","name":"Forge noire","needs":["C4","C5","C12"],"g":{"e":"craft","id":"obsidianBlade"},"n":1,"t":["Forger la lame d’obsidienne","Forge an obsidian blade"],"eff":"The best sword in the game","sc":"lava","page":["Le forgeron des Terres Brûlées battit l'obsidienne trois jours et trois nuits. La lame qui en sortit était noire comme la nuit et chantait doucement chaque fois qu'on la tirait du fourreau.","The Badlands smith hammered the obsidian for three days and three nights. The blade that came out was black as night and sang softly whenever it left its sheath."]},{"id":"C11","lane":"C","name":"Harpes du vent","needs":["C9","P7","L14"],"g":{"e":"flag","f":"harps"},"n":1,"t":["Jouer l’air des harpes du vent","Play the wind harps in order"],"eff":"A new song joins the playlist","sc":"sky","page":["Sur les cordes des harpes du vent, {nom} rejoua l'air de la vieille boîte à musique, note pour note. Les nuages s'écartèrent, et quelque part, très loin sous la terre, quelque chose soupira.","On the strings of the wind harps, {name} played the old music box's tune, note for note. The clouds parted, and somewhere far beneath the earth, something sighed."]},{"id":"C12","lane":"C","name":"Poudre noire","needs":["C3"],"g":{"e":"kill","mob":"beetle"},"n":3,"t":["Récolter la poudre de 3 scarabées-bombes","Collect blasting powder from 3 bomb beetles to open the sealed forge"],"eff":"Blasting powder: mine 3 tiles at once","sc":"lava","page":["La forge noire était scellée par un éboulis. Trois scarabées-bombes plus tard — attirés, esquivés, et pas trop près s'il vous plaît —, {nom} avait assez de poudre pour faire sauter les rochers. BOUM ! La porte de la forge apparut dans la poussière.","The black forge was sealed by a rockfall. Three bomb beetles later — lured, dodged, and not too close, please — {name} had enough powder to blast the rocks. BOOM! The forge door appeared through the dust."]},{"id":"C13","lane":"C","name":"La nuit des gargouilles","needs":["C7"],"g":{"e":"kill","mob":"gargoyle"},"n":3,"t":["Briser 3 gargouilles la nuit","Survive a night in the island ruins and smash 3 gargoyles"],"eff":"Stone hearts open the Queen of Winds' tower","sc":"sky","page":["Le jour, les gargouilles avaient servi de bancs à {nom} pour regarder les nuages. La nuit, elles se réveillèrent. Trois coups de marteau et trois cœurs de pierre plus tard, la porte de la tour de la Reine des Vents se mit à trembler.","By day, {name} had sat on the gargoyles to watch the clouds. By night, they woke up. Three hammer blows and three stone hearts later, the door of the Queen of Winds' tower began to shake."]},{"id":"E1","lane":"F","name":"Le Grand Siège","needs":["F8","F11","F12","L12","L16"],"g":{"e":"flag","f":"grandSiege"},"n":1,"t":["Tenir 3 nuits de siège à la maison","Survive a 3-night siege at home; the village guards arrive with their banner, and it must stay up. Win and they leave it with you."],"eff":"Trophy: the village banner. Sieges are smaller from then on. Max energy +10 %.","sc":"home","page":["Trois nuits durant, les monstres battirent les murs comme une mer en colère. Mais cette fois, {nom} avait des amis : les gardes du village, le chiot, la tour et chaque pierre du mur tinrent bon. Au troisième matin, le soleil se leva sur une maison debout, et sur un drapeau tout neuf qui claquait au vent.","For three nights the monsters pounded the walls like an angry sea. But {name} was no longer alone in the world: the village guards, the pup, the tower and every stone of the wall held fast. On the third morning the sun rose over a house still standing, and over a brand-new banner snapping in the wind."],"end":1},{"id":"E2","lane":"P","name":"La Bibliothèque engloutie","needs":["P10","P11","P8","L4","P13"],"g":{"e":"flag","f":"library"},"n":1,"t":["Résoudre les 7 pierres de la bibliothèque engloutie","A flooded cave under the Far Shore lake (ring 3): 7 tablets in a row at grade + 2, water rising; wraiths haunt it until banished. These tablets never sleep: a wrong answer makes the water rise faster, and if it floods you are washed out and can try again the next day."],"eff":"Trophy: the golden abacus. Tablets give two more tries. The Scholars' story is told. Max energy +10 %.","sc":"flood","page":["L'eau montait, sept pierres attendaient, et il n'y avait pas de temps pour hésiter. Quand la dernière réponse résonna, la bibliothèque des Savants livra son secret : sous la petite maison dort la Grande Moule, et c'est sa chanson triste qui appelle les monstres chaque nuit. Sur la dernière page du registre, {nom} reconnut l'écriture de grand-mère.","The water was rising, seven stones were waiting, and there was no time to hesitate. When the last answer rang out, the Scholars' library gave up its secret: under the little house sleeps the Great Mussel, and it is her sad song that calls the monsters every night. On the last page of the register, {name} recognised Grandma's handwriting."],"end":1},{"id":"E3","lane":"L","name":"Le Roi du Givre","needs":["L11"],"g":{"e":"kill","mob":"frostKing"},"n":1,"t":["Vaincre le Roi du Givre","Enter the ice hall (opened by the igloo elder) and beat the Frost King."],"eff":"Trophy: the frost crown, first seal. The fork crossing opens (required). Max energy +10 %.","sc":"snow","page":["Le Roi du Givre se battit comme une tempête, puis tomba à genoux. « Je gardais l'un des sceaux, souffla-t-il en tendant sa couronne. Elle se réveille. Les deux autres gardiens ont perdu la tête. Va. » Et derrière lui, la route du sud s'ouvrit.","The Frost King fought like a blizzard, then fell to his knees. \"I guarded one of the seals,\" he breathed, holding out his crown. \"She is waking. The other two guardians have lost their minds. Go.\" And behind him, the southern road opened."],"end":1},{"id":"E4","lane":"C","name":"Braises et Vents","needs":["C10","C11","C13"],"g":{"e":"flag","f":"twoBosses"},"n":1,"t":["Vaincre le Seigneur des Braises et la Reine des Vents","Beat the Lord of Embers and the Queen of Winds, in either order."],"eff":"Trophies: ember heart and wind feather, the last two seals. Both climates ease by half. Max energy +10 %.","sc":"sky","page":["Le Seigneur des Braises s'éteignit comme un feu de camp au petit matin, et la Reine des Vents se tut comme une tempête qui s'endort. Chacun laissa un sceau : un cœur de braise, une plume de vent. Les trois gardiens avaient parlé ; il ne restait plus qu'à rentrer à la maison.","The Lord of Embers went out like a campfire at dawn, and the Queen of Winds fell silent like a storm falling asleep. Each left a seal: an ember heart, a wind feather. All three guardians had spoken; there was nothing left but to go home."],"end":1},{"id":"FIN","lane":"X","name":"Au cœur de la Mine-Moule","needs":["E1","E2","E3","E4"],"g":{"e":"flag","f":"lullaby"},"n":1,"t":["Descendre au cœur de la Mine-Moule","Go down into the heart of the Mine-Moule"],"eff":"Credits roll over the night sky. Nights are gentler from then on; the world carries on and the costume quests open.","sc":"mine","page":["Sous la petite maison, au plus profond de la Mine-Moule, la Grande Moule ouvrit un œil grand comme la lune. Elle n'était pas méchante : elle était seule, et elle chantait sa peine depuis mille ans. {nom} rangea son épée, posa les trois sceaux sur la vieille boîte à musique et joua la chanson des Savants, celle de grand-mère. La Grande Moule écouta, ferma son œil, et se rendormit, consolée. Depuis, les nuits sont plus douces, et dans la petite maison au bout du chemin, quelqu'un dort très bien. Fin… ou presque.","Under the little house, deep in the heart of the Mine-Moule, the Great Mussel opened an eye as big as the moon. She was not wicked: she was lonely, and she had been singing her sorrow for a thousand years. {name} put the sword away, set the three seals on the old music box and played the Scholars' song, Grandma's song. The Great Mussel listened, closed her eye, and went back to sleep, comforted. Since then the nights have been gentler, and in the little house at the end of the road, someone sleeps very well. The end… or almost."],"end":1}],"P0":{"id":"P0","name":"Prologue","sc":"home","page":["Grand-mère avait laissé deux choses à {nom} : sa petite maison au bout du chemin, et un livre aux pages blanches posé sur la table de chevet. Sur la première page, de sa belle écriture penchée, elle avait écrit   ngName.value = 'Oggy'; modal.hidden = false; setTimeout(() => { ngName.focus(); ngName.select(); }, 30);
}
function closeNewGame() { modal.hidden = true; G.modal = false; Input.k = {}; }
ngForm.addEventListener('submit', (e) => {
  e.preventDefault(); Audio.ensure();
  const name = Array.from((ngName.value || '').trim() || 'Oggy').slice(0, 16).join('');
  const fd = new FormData(ngForm), flavor = fd.get('flavor') || 'valley', len = +(fd.get('len') || 14), mode = fd.get('mode') || 'story';
  Save.d.slots[G.ngSlot] = newSave(name, flavor, len); Save.d.slots[G.ngSlot].mode = mode; Save.d.slots[G.ngSlot].grade = Save.d.slots[G.ngSlot].gradeStart = +(fd.get('grade') || 3); Save.save(); closeNewGame(); Audio.sfx('start'); startPlay(G.ngSlot);
});
document.getElementById('ngCancel').addEventListener('click', () => { closeNewGame(); Audio.sfx('click'); });
modal.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeNewGame(); } e.stopPropagation(); });

// ── LOADING ─────────────────────────────────────────────────────────
function loadingDraw(dt) {
  const Lx = L(); G.loadT += dt;
  R(ctx, 0, 0, W, H, '#140d09'); const r = rng(3); for (let k = 0; k < 120; k++) R(ctx, r() * W | 0, r() * H | 0, 30 + (r() * 80 | 0), 1, '#1f150f');
  const steps = Lx.loading, total = 1.8, i = Math.min(steps.length - 1, Math.floor(G.loadT / total * steps.length));
  // warm terrain caches near the spawn while the bar fills
  if (G.loadT > 0.2 && G.loadT < total) { const si = seasonInfo(G.s.clock.day, G.s.seasonDays), A = G.world.areas[G.p.area], t0 = Math.floor(G.p.x / TW); for (const ti of [t0 - 1, t0, t0 + 1]) if (ti >= 0 && ti < A.terrains.length) getTerrain(G.world, G.p.area, ti, S[si.key]); }
  text(ctx, 'MINE-MOULE', W / 2, 170, 44, '#ffd23f', 'center', 700, '#0e0805');
  text(ctx, G.s.name + ' · ' + L().flavors[G.s.flavor], W / 2, 214, 16, '#c9b48a', 'center', 500);
  const bw = 420, bx = W / 2 - bw / 2, by = 300; R(ctx, bx - 4, by - 4, bw + 8, 30, '#0e0805'); R(ctx, bx, by, bw, 22, '#3b2a1d'); const f = clamp(G.loadT / total, 0, 1); R(ctx, bx, by, bw * f, 22, '#ffd23f'); R(ctx, bx, by, bw * f, 5, '#fff0a0');
  for (let q = bx + 21; q < bx + bw; q += 21) R(ctx, q, by, 2, 22, 'rgba(0,0,0,0.2)');
  text(ctx, steps[i], W / 2, by + 52, 17, '#f3e6c4', 'center', 500);
  drawPerson(ctx, bx + bw * f, by - 8, HERO_PAL, { facing: 1, walk: true, phase: G.t * 14 });
  if (G.loadT > total + 0.3) { G.scene = 'PLAY'; G.music = ''; G.banner = null; say(Lx.wake); }
}

// ── MAIN LOOP ───────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; G.t += dt;
  pollPad(); G.hits = []; G.frameN++;
  if (G.scene === 'TITLE') titleDraw(dt);
  else if (G.scene === 'LOADING') loadingDraw(dt);
  else if (G.scene === 'PLAY') {
    if (!G.panel && !G.fade && !G.cab) { if (Input.hit('pause')) { if (G.sel >= 0) { G.sel = -1; G.ghost = null; Audio.sfx('click'); } else { G.panel = 'pause'; G.menuI = 0; Audio.sfx('click'); } } else if (Input.hit('inv') || Input.hit('equip')) { if (G.combat) { say(L().noFight); Audio.sfx('buzz'); } else { G.panel = Input.hit('inv') ? 'inv' : 'equip'; Audio.sfx('click'); } } else if (Input.hit('journal')) { G.panel = 'journal'; Audio.sfx('click'); } for (let i = 0; i < 5; i++) if (Input.hit('n' + (i + 1))) { G.sel = G.sel === i ? -1 : i; G.ghost = null; Audio.sfx('click'); } }
    else if (G.panel && G.panel !== 'tablet' && (Input.hit('journal') && G.panel === 'journal')) { G.panel = null; Audio.sfx('click'); }
    else if (G.panel && (Input.hit('pause') || (Input.hit('back') && G.panel !== 'tablet') || (G.panel === 'inv' && Input.hit('inv')) || (G.panel === 'equip' && Input.hit('equip')))) { G.panel = null; Audio.sfx('click'); }
    const st = playUpdate(G.fade ? 0 : dt); playDraw(dt, st);
  }
  if (G.fade) { const f = G.fade; f.t += dt; const half = f.dur / 2; if (!f.done && f.t >= half) { f.done = true; f.fn(); } const a = f.t < half ? f.t / half : 1 - (f.t - half) / half; ctx.globalAlpha = clamp(a, 0, 1); R(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; if (f.msg && a > 0.55) { ctx.globalAlpha = clamp((a - 0.55) / 0.45, 0, 1); text(ctx, f.msg, W / 2, H / 2, 22, '#f3e6c4', 'center', 600); if (G.s && (f.msg === L().sleep || f.msg === L().nap || f.msg === L().tentSleep || f.msg === L().fainted)) text(ctx, 'Z z z', W / 2 + Math.sin(G.t * 2) * 8, H / 2 - 44 - (G.t * 10 % 12), 18, '#8a9ad8', 'center'); ctx.globalAlpha = 1; } if (f.t >= f.dur) G.fade = null; }
  if (Input.click && !G.modal) { const c = Input.click; let hit = false; for (let i = G.hits.length - 1; i >= 0; i--) { const h = G.hits[i]; if (c.x >= h[0] && c.x < h[0] + h[2] && c.y >= h[1] && c.y < h[1] + h[3]) { h[4](); hit = true; break; } } if (!hit && G.scene === 'PLAY' && !G.panel && !G.fade && !G.combat) worldClick(c); }
  vctx.fillStyle = '#000'; vctx.fillRect(0, 0, cv.width, cv.height); vctx.imageSmoothingEnabled = false;
  const shx = G.shake > 0 ? Math.round((Math.random() * 6 - 3) * VIEW.s) : 0, shy = G.shake > 0 ? Math.round((Math.random() * 6 - 3) * VIEW.s) : 0; G.shake = Math.max(0, (G.shake || 0) - dt);
  vctx.drawImage(buf, 0, 0, W, H, VIEW.x + shx, VIEW.y + shy, VIEW.w, VIEW.h);
  Input.end();
  requestAnimationFrame(frame);
}
Audio.onEnd = (k) => { if (G.scene === 'PLAY' && G.s && k === G.music) { G.s.music.pos++; G.music = ''; } };
Audio.playMusic('title');
if (document.fonts && document.fonts.load) document.fonts.load('700 22px "Pixelify Sans"').catch(() => { });
requestAnimationFrame(frame);
</script>
