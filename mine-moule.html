es du haut d’une tour (2 blocs ou plus)","Shoot 5 monsters from the top of a tower (2+ blocks high)"],"eff":"Tower range +30 %","sc":"home","page":["Du haut de sa tour, {nom} voyait la nuit arriver de très loin. Cinq flèches, cinq monstres qui ne reviendraient plus : la tour devint un phare, et les villageois la montraient du doigt avec fierté.","From the top of the tower, {name} could see the night coming from far away. Five arrows, five monsters that would not be back: the tower became a lighthouse, and villagers pointed at it with pride."],"nm":["Tour de garde","Watchtower"],"rw":["Portée de la tour +30 %","Tower range +30 %"]},{"id":"F12","lane":"F","name":"Fête au village","needs":["F10","L8","F13"],"g":{"e":"flag","f":"festival"},"n":1,"t":["Une saison (7 jours max) sans vol, avec 5 échanges","One season (7 days at most) with no theft and 5 trades"],"eff":"A festival night with its own song and a gift","sc":"village","page":["Toute une saison sans un seul larcin, et les invités venus des quatre coins de l'Autre Rive. On sortit les lanternes, les violons et les gâteaux, et {nom} dansa jusqu'à ce que la lune elle-même demande grâce.","A whole season without a single theft, and guests from every corner of the Far Shore. Out came the lanterns, the fiddles and the cakes, and {name} danced until the moon itself begged for mercy."],"nm":["Fête au village","Village Fair"],"rw":["Une nuit de fête avec sa chanson et un cadeau","A festival night with its own song and a gift"]},{"id":"F13","lane":"F","name":"Le nid du voleur","needs":["F2"],"g":{"e":"kill","mob":"crow"},"n":1,"t":["Rattraper un corbeau voleur (il rôde près de la forêt) et reprendre ce qu’il a volé","Catch a thief crow (it lurks near the forest) and take back what it stole"],"eff":"The nest holds the village's lost festival bell","sc":"forest","page":["Le corbeau voleur fila avec la cuillère d'argent de {nom}, mais {nom} le suivit d'arbre en arbre jusqu'à son nid. Là-haut, parmi les boutons et les clés perdues, brillait une cloche dorée : la cloche des fêtes du village, disparue depuis des années.","The thief crow flew off with {name}'s silver spoon, but {name} followed it from tree to tree all the way to its nest. Up there, among buttons and lost keys, gleamed a golden bell: the village's festival bell, missing for years."],"nm":["Le nid du voleur","The Thief's Nest"],"rw":["Le nid cache la cloche de fête perdue du village","The nest holds the village’s lost festival bell"]},{"id":"F14","lane":"F","name":"Un abri pour la nuit","needs":["F7"],"g":{"e":"flag","f":"shelterSleep"},"n":1,"t":["Bâtir un abri fermé en pleine nature (murs, toit lié, porte), y planter la tente et dormir une nuit","Build a closed shelter in the wild (walls, bound roof, door), pitch the tent inside and sleep through a night"],"eff":"Shelters you build count as beds: safe sleep and a respawn point","sc":"forest","page":["Loin de la maison, la nuit tombait vite. {nom} empila des pierres, lia un toit de planches avec de la toile d'araignée, planta la tente à l'abri et ferma la petite porte. Dehors, les monstres grattèrent toute la nuit ; dedans, on dormit comme à la maison.","Far from home, night fell fast. {name} stacked stones, bound a plank roof together with spider silk, pitched the tent inside and shut the little door. Outside, the monsters scratched all night; inside, it was as cosy as home."],"nm":["Un abri pour la nuit","A Shelter for the Night"],"rw":["Tes abris comptent comme des lits : nuit sûre et point de réveil","Shelters you build count as beds: safe sleep and a respawn point"]},{"id":"P1","lane":"P","name":"Lumière !","needs":["F1"],"g":{"e":"craft","id":"lantern"},"n":1,"t":["Fabriquer la lanterne","Craft the lantern"],"eff":"Cave mouths get a marker on the banner","sc":"cave","page":["Dans le noir des grottes, même le courage tremble. {nom} alluma sa première lanterne, et l'ombre recula d'un pas, comme surprise d'être enfin regardée en face.","In the dark of the caves, even courage trembles. {name} lit a first lantern, and the shadows stepped back, as if surprised to be looked in the eye at last."],"nm":["Lumière !","Light!"],"rw":["Les entrées de grottes ont un repère sur la bannière","Cave mouths get a marker on the banner"]},{"id":"P2","lane":"P","name":"Premier minerai","needs":["P1"],"g":{"e":"mine"},"n":5,"t":["Miner du minerai 5 fois","Mine ore 5 times"],"eff":"Pickaxe swings faster","sc":"cave","page":["Toc, toc, toc ! La pioche chanta contre la roche, et la montagne, en grondant, céda cinq pépites brillantes. {nom} les tint dans la lumière comme on tient des étoiles tombées.","Tock, tock, tock! The pickaxe sang against the rock, and the grumbling mountain gave up five shining nuggets. {name} held them to the light like fallen stars."],"nm":["Premier minerai","First Ore"],"rw":["La pioche frappe plus vite","Pickaxe swings faster"]},{"id":"P3","lane":"P","name":"Fond de grotte","needs":["P2"],"g":{"e":"reach","kind":"caveEnd"},"n":1,"t":["Atteindre le fond d’une grotte","Reach the end of any cave"],"eff":"A miner settles in the nearest village","sc":"cave","page":["Plus bas que les racines, plus bas que les sources, {nom} atteignit le fond de la grotte. Là, gravée dans la pierre, une main inconnue avait écrit : « Nous étions là avant vous. »","Deeper than the roots, deeper than the springs, {name} reached the bottom of the cave. There, carved in the stone, an unknown hand had written: \"We were here before you.\""],"nm":["Fond de grotte","Cave Bottom"],"rw":["Un mineur s’installe au village le plus proche","A miner settles in the nearest village"]},{"id":"P4","lane":"P","name":"Pierre savante","needs":["P1"],"g":{"e":"solve","kind":"treasure"},"n":1,"t":["Résoudre une pierre savante à trésor","Solve a treasure scholar’s stone"],"eff":"Tablets you have seen show on the banner","sc":"ruin","page":["Une pierre qui pose des questions ! {nom} réfléchit, compta sur ses doigts, et la bonne réponse fit s'ouvrir un coffre caché. Les anciens mineurs, semblait-il, aimaient les énigmes plus que l'or.","A stone that asks questions! {name} thought hard, counted on fingers, and the right answer opened a hidden chest. The old miners, it seemed, loved riddles more than gold."],"nm":["Pierre savante","Scholar's Stone"],"rw":["Les pierres vues s’affichent sur la bannière","Stones you have seen show on the banner"]},{"id":"P5","lane":"P","name":"Le gobelin","needs":["P3"],"g":{"e":"kill","mob":"goblin"},"n":1,"t":["Vaincre un gobelin des grottes","Beat a cave goblin"],"eff":"Goblins drop more ore","sc":"cave","page":["Le gobelin grognait sur son tas de cailloux comme un dragon de poche. {nom} le chassa d'un coup bien placé, et il s'enfuit en abandonnant une bourse pleine de minerai.","The goblin growled over its pile of pebbles like a pocket-sized dragon. {name} chased it off with one good swing, and it fled, leaving a pouch full of ore behind."],"nm":["Le gobelin","The Goblin"],"rw":["Les gobelins lâchent plus de minerai","Goblins drop more ore"]},{"id":"P6","lane":"P","name":"Trois pierres","needs":["P4"],"g":{"e":"solve"},"n":3,"t":["Résoudre 3 pierres savantes","Solve 3 scholar’s stones"],"eff":"One hint after a wrong answer","sc":"ruin","page":["Trois pierres, trois énigmes, et chaque fois la même signature gravée : « Les Savants ». {nom} commença à se demander qui étaient ces Savants, et pourquoi leurs pierres semblaient l'attendre.","Three stones, three riddles, and each time the same carved signature: \"The Scholars\". {name} began to wonder who these Scholars were, and why their stones seemed to be waiting."],"nm":["Trois pierres","Three Stones"],"rw":["Un indice après une mauvaise réponse","One hint after a wrong answer"]},{"id":"P7","lane":"P","name":"Salle secrète","needs":["P3"],"g":{"e":"flag","f":"secret"},"n":1,"t":["Trouver une salle secrète dans une grotte","Find a secret room in a cave"],"eff":"You take the music box home: it sits on the bedside table and plays any song you have heard","sc":"cave","page":["Derrière un mur qui sonnait creux dormait une salle oubliée. Une vieille boîte à musique s'y réveilla au toucher de {nom} et joua un air que personne n'avait entendu depuis cent ans. {nom} l'emporta sous le bras et la posa sur la table de chevet, à côté du livre de grand-mère.","Behind a wall that rang hollow slept a forgotten room. An old music box woke at {name}'s touch and played a tune no one had heard in a hundred years. {name} carried it home and set it on the bedside table, next to Grandma's book."],"nm":["Salle secrète","Secret Room"],"rw":["La boîte à musique rentre à la maison et joue toutes les chansons entendues","The music box comes home and plays any song you have heard"]},{"id":"P8","lane":"P","name":"L'arcade","needs":["P2"],"g":{"e":"flag","f":"arcade"},"n":1,"t":["Casser le mur fissuré de la maison (pioche)","Break the cracked wall at home (pickaxe)"],"eff":"The arcade room opens (round 1)","sc":"home","page":["Un coup de pioche dans le mur de la maison, et voilà une pièce secrète pleine de lumières clignotantes ! Trois grandes machines y attendaient un joueur, et sur l'une d'elles, le tableau des records portait les initiales de grand-mère.","One swing of the pickaxe at the house wall, and behold a secret room full of blinking lights! Three great machines waited for a player, and on one of them the high-score table bore Grandma's initials."],"nm":["L'arcade","The Arcade"],"rw":["La salle d’arcade ouvre (manche 1)","The arcade room opens (round 1)"]},{"id":"P9","lane":"P","name":"Le dragon","needs":["P7"],"g":{"e":"flag","f":"dragon"},"n":1,"t":["Trouver la salle aux pièces du dragon de pierre, dans une grotte","Find the stone dragon’s coin room in a cave"],"eff":"A pile of coins to trade with","sc":"cave","page":["Le dragon dormait sur ses pièces d'or… mais il était de pierre, et depuis bien longtemps. {nom} lui fit une révérence polie avant de remplir ses poches, au cas où.","The dragon slept on its gold… but it was made of stone, and had been for ages. {name} bowed politely before filling both pockets, just in case."],"nm":["Le dragon","The Dragon"],"rw":["Un tas de pièces pour commercer","A pile of coins to trade with"]},{"id":"P10","lane":"P","name":"Sans faute","needs":["P6","L7"],"g":{"e":"flag","f":"streak5"},"n":1,"t":["Résoudre 5 pierres de suite sans erreur","Solve 5 stones in a row without a mistake"],"eff":"A grade badge on your save slot","sc":"ruin","page":["Le troll avait tout expliqué : les retenues, les tables, les astuces. Cinq énigmes plus tard, pas une erreur, et sur la dernière pierre apparut un mot nouveau : « Savant ». Le troll, en l'apprenant, ôta son chapeau.","The troll had explained it all: carrying, times tables, little tricks. Five riddles later, not one mistake, and on the last stone a new word appeared: \"Scholar\". When the troll heard, he took off his hat."],"nm":["Sans faute","No Mistakes"],"rw":["Un badge de niveau sur ta sauvegarde","A grade badge on your save slot"]},{"id":"P11","lane":"P","name":"Lanterne d'argent","needs":["P5","P9","F9"],"g":{"e":"craft","id":"silverLantern"},"n":1,"t":["Améliorer la lanterne en lanterne d’argent","Upgrade the lantern to the silver lantern"],"eff":"Light reaches twice as far","sc":"cave","page":["Le colporteur fournit l'argent, le dragon l'or, le gobelin le minerai. De tout cela, {nom} fit une lanterne si claire que la nuit, un peu honteuse, alla se cacher plus loin.","The pedlar gave the silver, the dragon the gold, the goblin the ore. From all of it {name} made a lantern so bright that the night, a little embarrassed, went to hide farther away."],"nm":["Lanterne d'argent","Silver Lantern"],"rw":["La lumière porte deux fois plus loin","Light reaches twice as far"]},{"id":"P12","lane":"P","name":"Le Bestiaire","needs":["P3"],"g":{"e":"flag","f":"beasts3"},"n":1,"t":["Avoir 3 sortes de monstres dans ton carnet (les combats comptent depuis le 1er jour), puis trouver l’épée et le livre derrière un mur fissuré de grotte","Have 3 kinds of monster in your record (fights count from day one), then find the sword and book behind a cracked cave wall"],"eff":"Grandma's sword and bestiary hang on the wall at home; every monster you beat gets a page","sc":"cave","page":["Derrière une paroi fendue, au fond d'une grotte, dormaient une épée ornée et un gros livre relié de cuir. Sur la couverture, grand-mère avait écrit : « Bestiaire — tout ce que j'ai affronté, et comment. » {nom} accrocha l'épée au mur de la maison et posa le livre juste en dessous, prêt à accueillir de nouvelles pages.","Behind a cracked wall at the back of a cave slept an ornate sword and a big leather-bound book. On the cover Grandma had written: \"Bestiary — everything I ever faced, and how.\" {name} hung the sword on the wall at home and set the book just below it, ready for new pages."],"nm":["Le Bestiaire","The Bestiary"],"rw":["L’épée et le bestiaire de grand-mère au mur ; chaque monstre vaincu a sa page","Grandma’s sword and bestiary on the wall; every monster you beat gets a page"]},{"id":"P13","lane":"P","name":"Le coffre qui mord","needs":["P3","L2"],"g":{"e":"kill","mob":"mimic"},"n":1,"t":["Vaincre un coffre-croqueur dans une grotte","Beat a mimic chest in a cave"],"eff":"Mimics' locks glint from across the screen, and they drop better treasure","sc":"cave","page":["Le coffre était trop beau, trop bien posé, trop seul. Quand {nom} souleva le couvercle, il claqua des dents ! Une bonne bataille plus tard, le coffre-croqueur rendit son trésor, et {nom} retint la leçon pour toujours : on regarde la serrure avant d'ouvrir.","The chest was too pretty, too neatly placed, too alone. When {name} lifted the lid, it snapped its teeth! One good fight later, the mimic gave up its treasure, and {name} learned the lesson forever: look at the lock before you open."],"nm":["Le coffre qui mord","The Biting Chest"],"rw":["Les serrures des coffres-croqueurs brillent de loin, et ils donnent de meilleurs trésors","Mimics’ locks glint from afar, and they drop better treasure"]},{"id":"L1","lane":"L","name":"Pont du troll","needs":["P4"],"g":{"e":"gate","g":"cross"},"n":1,"t":["Résoudre la pierre de la Traversée (battre le troll ne l’ouvre pas)","Solve the Crossing stone (beating the troll does not open it)"],"eff":"The Far Shore opens","sc":"bridge","page":["Le troll tonna : « Personne ne passe sans répondre ! » {nom} réfléchit, répondit juste, et le grand troll s'écarta en souriant de toutes ses dents mal rangées. Au-delà du pont, l'Autre Rive attendait.","The troll thundered: \"None shall pass without answering!\" {name} thought, answered right, and the great troll stepped aside, smiling with all his crooked teeth. Beyond the bridge, the Far Shore was waiting."],"nm":["Pont du troll","Troll Bridge"],"rw":["L’Autre Rive s’ouvre","The Far Shore opens"]},{"id":"L2","lane":"L","name":"Premier pas","needs":["L1"],"g":{"e":"reach","kind":"arrival"},"n":1,"t":["Arriver au village de l’Autre Rive","Reach the Far Shore arrival village"],"eff":"A bed in the arrival village","sc":"village","page":["Tout était plus grand de ce côté du pont : les arbres, les montagnes, les silences. Au village d'arrivée, on prêta un lit à {nom}, et l'on parla tout bas d'une chose qui gronde sous la terre, les nuits sans lune.","Everything was bigger on this side of the bridge: the trees, the mountains, the silences. In the arrival village they lent {name} a bed, and whispered of something that rumbles under the ground on moonless nights."],"nm":["Premier pas","First Steps"],"rw":["Un lit au village d’arrivée","A bed in the arrival village"]},{"id":"L3","lane":"L","name":"La meute","needs":["L2"],"g":{"e":"kill","mob":"wolf"},"n":3,"t":["Vaincre 3 loups d’une meute","Beat 3 wolves from a pack"],"eff":"Fewer wolves in rings 1–2","sc":"forest","page":["Ils étaient trois, puis quatre, les yeux comme des braises. {nom} tint bon, dos à un arbre, jusqu'à ce que le chef de meute baisse la tête et emmène les siens loin des chemins.","There were three, then four, with eyes like embers. {name} stood firm, back to a tree, until the pack leader lowered his head and led the others away from the paths."],"nm":["La meute","The Pack"],"rw":["Moins de loups aux anneaux 1–2","Fewer wolves in rings 1–2"]},{"id":"L4","lane":"L","name":"Spectres","needs":["L2","P11","P12"],"g":{"e":"kill","mob":"wraith"},"n":3,"t":["Bannir 3 spectres la nuit avec la lanterne","Banish 3 wraiths at night with the lantern"],"eff":"Fewer wraiths in rings 2–3","sc":"forest","page":["Les spectres glissaient entre les arbres comme des draps oubliés au vent. Un à un, la lanterne d'argent les dissipa, et chacun murmura en partant le même mot : « Elle se réveille… »","The wraiths drifted between the trees like sheets forgotten on a line. One by one the silver lantern dissolved them, and each whispered the same words as it went: \"She is waking…\""],"nm":["Spectres","Wraiths"],"rw":["Moins de spectres aux anneaux 2–3","Fewer wraiths in rings 2–3"]},{"id":"L5","lane":"L","name":"Camp brigand","needs":["L3","L6","F8"],"g":{"e":"kill","mob":"chief"},"n":1,"t":["Vaincre le chef des brigands dans son camp en forêt","Beat the brigand chief at his forest camp"],"eff":"Iron key; the camp becomes a waystation","sc":"forest","page":["Le chiot flaira la fumée du camp bien avant que {nom} ne la voie. Le chef des brigands se battit comme un ours, puis tomba, et dans sa poche brillait une clé de fer couverte de givre.","The pup smelled the camp's smoke long before {name} saw it. The brigand chief fought like a bear, then fell, and in his pocket gleamed an iron key covered in frost."],"nm":["Camp brigand","Brigand Camp"],"rw":["Clé de fer ; le camp devient un relais","Iron key; the camp becomes a waystation"]},{"id":"L6","lane":"L","name":"Les gardes","needs":["L2"],"g":{"e":"kill","mob":"brigand"},"n":5,"t":["Vaincre 5 brigands","Beat 5 brigands"],"eff":"Brigands flee you at low health","sc":"forest","page":["Cinq brigands, cinq bandanas, cinq leçons de politesse. Depuis, quand ils aperçoivent {nom} au détour d'un chemin, les brigands se rappellent soudain une affaire très urgente à régler ailleurs.","Five brigands, five bandanas, five lessons in manners. Ever since, when they spot {name} on the road, brigands suddenly remember something very urgent to do elsewhere."],"nm":["Les gardes","The Guards"],"rw":["Les brigands te fuient quand ils sont blessés","Brigands flee you at low health"]},{"id":"L7","lane":"L","name":"Le troll ami","needs":["L1"],"g":{"e":"troll"},"n":3,"t":["Commercer 3 fois avec le troll","Trade with the troll 3 times"],"eff":"The troll sells rare goods and teaches tablet tricks","sc":"bridge","page":["Trois marchés plus tard, le troll confia son plus grand secret : il adorait les chiffres. « Les Savants me les ont appris, avant de descendre sous la terre », dit-il en essuyant une larme grosse comme une pomme.","Three trades later, the troll shared his biggest secret: he loved numbers. \"The Scholars taught me, before they went down under the ground,\" he said, wiping a tear as big as an apple."],"nm":["Le troll ami","Troll Friend"],"rw":["Le troll vend des objets rares et apprend des astuces pour les pierres","The troll sells rare goods and teaches stone tricks"]},{"id":"L8","lane":"L","name":"Le grand tour","needs":["L2","L15"],"g":{"e":"flag","f":"visitAll"},"n":1,"t":["Visiter tous les villages de l’Autre Rive (et le hameau)","Visit every Far Shore village (and the hamlet)"],"eff":"A map page in the journal","sc":"village","page":["{nom} visita chaque village de l'Autre Rive et dessina une carte de tout ce que ses yeux virent. Partout on l'accueillit, et partout on promit de venir danser si jamais il y avait une fête.","{name} visited every village on the Far Shore and drew a map of everything seen. Everywhere {name} was welcomed, and everywhere people promised to come and dance if there was ever a party."],"nm":["Le grand tour","The Grand Tour"],"rw":["Une page de carte dans le journal, et les diligences","A map page in the journal, and the coaches"]},{"id":"L9","lane":"L","name":"2ᵉ traversée","needs":["L5","P6"],"g":{"e":"gate","g":"cross2"},"n":1,"t":["Apporter la clé de fer et résoudre la pierre (niveau + 2) de la seconde traversée","Bring the iron key and solve the stone (grade + 2) at the second crossing"],"eff":"The Frozen North opens","sc":"snow","page":["La clé de fer tourna dans une serrure gelée, et la pierre posa sa question la plus difficile. {nom} répondit, la porte s'ouvrit, et un vent blanc comme le lait souffla depuis le Grand Nord.","The iron key turned in a frozen lock, and the stone asked its hardest question. {name} answered, the gate swung open, and a wind white as milk blew in from the Frozen North."],"nm":["2ᵉ traversée","Second Crossing"],"rw":["Le Grand Nord s’ouvre","The Frozen North opens"]},{"id":"L10","lane":"L","name":"Premier froid","needs":["L9","F6","L13"],"g":{"e":"craft","id":"furCoat"},"n":1,"t":["Fabriquer le manteau de fourrure (2 peaux de sanglier, 3 toiles)","Craft the fur coat (2 boar hides, 3 web)"],"eff":"Cold drains half as fast","sc":"snow","page":["Le froid du Nord mordait comme un chien sans maître. Dans un manteau taillé dans le cuir des sangliers, le ventre plein de soupe, {nom} avança quand même, laissant derrière soi une file de pas bien décidés. Plus loin, on racontait que la fourrure des yétis tenait encore plus chaud…","The northern cold bit like a dog with no master. In a coat cut from boar hide, belly full of soup, {name} pressed on anyway, leaving a line of very determined footprints. Further on, people said yeti fur was warmer still…"],"nm":["Premier froid","First Frost"],"rw":["Le froid fatigue deux fois moins","Cold drains half as fast"]},{"id":"L11","lane":"L","name":"Les igloos","needs":["L10","L17"],"g":{"e":"kill","mob":"snowman"},"n":2,"t":["Défendre le village d’igloos : abattre 2 bonshommes de neige maudits la nuit (marteau, ou près d’un feu)","Guard the igloo village: smash 2 cursed snowmen at night (hammer, or near a fire)"],"eff":"Warm soup on the trade list; the elder opens the ice hall","sc":"snow","page":["Toute la nuit, les bonshommes de neige maudits revinrent, encore et encore, jusqu'à ce que {nom} les fasse fondre près du feu. Au matin, les anciens écoutèrent en hochant la tête. « Le Roi du Givre n'a pas toujours été cruel, dit la plus vieille. Il garde quelque chose. Ou plutôt, il le gardait. »","All night the cursed snowmen came back, again and again, until {name} melted them by the fire. In the morning the elders listened, nodding. \"The Frost King was not always cruel,\" said the eldest. \"He guards something. Or rather, he used to.\""],"nm":["Les igloos","The Igloos"],"rw":["Soupe chaude au marché ; l’ancien ouvre la salle de glace","Warm soup on the trade list; the elder opens the ice hall"]},{"id":"L12","lane":"L","name":"La plage aux crabes","needs":["L2"],"g":{"e":"kill","mob":"crab"},"n":2,"t":["Casser 2 crabes-boucliers sur la plage (frappe-les de dos)","Crack 2 shield crabs on the beach (hit them from behind)"],"eff":"Shell armour recipe; shell shields for the village guards","sc":"bridge","page":["Les crabes-boucliers montaient la garde sur la plage, carapace en avant. {nom} passa derrière eux, un, deux, trois, et rapporta leurs coquilles au forgeron. « De quoi faire des boucliers pour toute la garde ! » dit-il en riant.","The shield crabs stood guard on the beach, shells first. {name} slipped behind them, one, two, three, and brought their shells to the smith. \"Enough for shields for the whole guard!\" he laughed."],"nm":["La plage aux crabes","Crab Beach"],"rw":["Recette d’armure de carapace ; boucliers pour les gardes du village","Shell armour recipe; shell shields for the village guards"]},{"id":"L13","lane":"L","name":"Le sanglier têtu","needs":["L2"],"g":{"e":"stun","mob":"boar"},"n":3,"t":["Faire s’assommer 3 sangliers contre un arbre ou un bloc","Make 3 boars stun themselves on a tree or block"],"eff":"Boar hide for the fur coat","sc":"forest","page":["Le sanglier fonçait tout droit, comme toujours. {nom} attendit le dernier moment, sauta, et la bête alla saluer un chêne de tout son front. Trois sangliers étourdis plus tard, il y avait assez de cuir pour affronter le froid du Nord.","The boar charged straight ahead, as always. {name} waited until the last moment, jumped, and the beast greeted an oak tree with its whole forehead. Three dizzy boars later, there was enough hide to face the cold of the North."],"nm":["Le sanglier têtu","The Stubborn Boar"],"rw":["Peau de sanglier pour le manteau de fourrure","Boar hide for the fur coat"]},{"id":"L14","lane":"L","name":"La pêche sur glace","needs":["L10"],"g":{"e":"flag","f":"iceFish"},"n":1,"t":["Étourdir le morse grognon, puis pêcher 5 poissons à son trou","Stun the grumpy walrus, then catch 5 fish at its hole"],"eff":"Walrus ivory picks for the wind harps","sc":"snow","page":["Le morse grognon gardait le meilleur trou de pêche, et les manchots passaient en glissant comme des boulets. {nom} étourdit le morse d'un bon coup, esquiva la bande, et remonta cinq poissons. Le morse, en se réveillant, laissa deux défenses d'ivoire en signe de respect.","The grumpy walrus guarded the best fishing hole, and the penguins slid by like cannonballs. {name} stunned the walrus with one good blow, dodged the gang, and pulled up five fish. When the walrus woke, it left two ivory tusks as a sign of respect."],"nm":["La pêche sur glace","Ice Fishing"],"rw":["Ivoire de morse pour les harpes du vent","Walrus ivory for the wind harps"]},{"id":"L15","lane":"L","name":"Le pont suspendu","needs":["L2","F14"],"g":{"e":"flag","f":"bridge15"},"n":1,"t":["Franchir un ravin de l’Autre Rive avec un pont lié à la toile","Span a Far Shore ravine with a web-bound bridge"],"eff":"A shortcut to the village beyond the ravine","sc":"bridge","page":["Un ravin coupait le chemin, si profond qu'on n'en voyait pas le fond. Planche après planche, liées de toile d'araignée, {nom} lança un pont au-dessus du vide et passa de l'autre côté sans regarder en bas — enfin, presque.","A ravine cut the path, so deep you could not see the bottom. Plank after plank, bound with spider silk, {name} threw a bridge across the void and crossed without looking down — well, almost."],"nm":["Le pont suspendu","The Rope Bridge"],"rw":["Un raccourci vers le village au-delà du ravin","A shortcut to the village beyond the ravine"]},{"id":"L16","lane":"L","name":"Le fort","needs":["L6","F14"],"g":{"e":"flag","f":"fortNight"},"n":1,"t":["Bâtir un fort à l’anneau 2 ou plus (tour, porte sauvage, pieux), y dormir et tenir tout le siège de la nuit","Build a fort at ring 2+ (tower, wild door, spikes), sleep in it and hold it through the night siege"],"eff":"Siege monsters lose heart sooner at forts you have held","sc":"forest","page":["Sur une colline de l'Autre Rive, {nom} bâtit un petit fort : une tour, une porte solide, des pieux tout autour. Quand la nuit tomba, les monstres vinrent en nombre. Au matin, le fort tenait toujours, et une araignée boudeuse retombait pour la centième fois au pied du mur.","On a hill of the Far Shore, {name} built a little fort: a tower, a sturdy door, spikes all around. When night fell, the monsters came in force. By morning the fort still stood, and a sulky spider was sliding down the wall for the hundredth time."],"nm":["Le fort","The Fort"],"rw":["Les monstres du siège abandonnent plus vite devant tes forts","Siege monsters lose heart sooner at your forts"]},{"id":"L17","lane":"L","name":"L'igloo","needs":["L10"],"g":{"e":"flag","f":"igloo"},"n":1,"t":["Construire un igloo en blocs de neige (5 ou plus) et y dormir","Build an igloo from snow blocks (5 or more) and sleep in it"],"eff":"Snow blocks unlocked; a night in your igloo restores warmth fully","sc":"snow","page":["Dans le Grand Nord, la neige elle-même devient une maison. Bloc après bloc, {nom} monta un igloo bien rond, se glissa à l'intérieur et, pour la première fois depuis la traversée, n'eut plus froid du tout.","In the Frozen North, the snow itself becomes a house. Block by block, {name} raised a nice round igloo, crawled inside and, for the first time since the crossing, was not cold at all."],"nm":["L'igloo","The Igloo"],"rw":["Blocs de neige débloqués ; une nuit dans ton igloo réchauffe complètement","Snow blocks unlocked; a night in your igloo restores warmth fully"]},{"id":"C1","lane":"C","name":"La fourche","needs":["E3"],"g":{"e":"reach","kind":"fork"},"n":1,"t":["Atteindre la fourche au bout du Grand Nord","Reach the fork at the end of the Frozen North"],"eff":"Both hard lands open","sc":"snow","page":["Au bout du Nord, le chemin se séparait en deux : à gauche, un ciel rouge de braises ; à droite, des îles qui flottaient dans les nuages. {nom} prit une grande inspiration. Il faudrait aller des deux côtés.","At the end of the North, the road split in two: to the left a sky red with embers, to the right islands floating in the clouds. {name} took a deep breath. Both ways would have to be walked."],"nm":["La fourche","The Fork"],"rw":["Les deux terres difficiles s’ouvrent","Both hard lands open"]},{"id":"C2","lane":"C","name":"Gourde fraîche","needs":["C1"],"g":{"e":"craft","id":"flask"},"n":1,"t":["Fabriquer la gourde fraîche avec des écailles de salamandre de lave","Craft the water flask from lava-salamander scales"],"eff":"Heat drains half as fast","sc":"lava","page":["Dans les Terres Brûlées, l'air tremblait comme au-dessus d'une marmite. Avec les écailles d'une salamandre attrapée en plein saut, {nom} façonna une gourde qui gardait l'eau fraîche, et entra dans la fournaise en sifflotant pour se donner du courage.","In the Badlands the air shimmered like the air above a cooking pot. With the scales of a salamander caught mid-leap, {name} made a flask that kept water cool, and walked into the furnace whistling for courage."],"nm":["Gourde fraîche","Cool Flask"],"rw":["La chaleur fatigue deux fois moins","Heat drains half as fast"]},{"id":"C3","lane":"C","name":"Rivière de lave","needs":["C2","F7"],"g":{"e":"flag","f":"lavaBridge"},"n":1,"t":["Franchir une rivière de lave sur un pont de pierre lié au métal ou d’obsidienne (la toile brûle près de la lave)","Bridge a lava river with metal-bound stone or obsidian blocks (web burns near lava)"],"eff":"Your lava bridges stay for good, and a shortcut opens to the Badlands village","sc":"lava","page":["La rivière de lave coulait en grognant, bien trop large pour sauter. Bloc après bloc, comme autrefois le mur autour de la maison, {nom} bâtit un pont de pierre et passa sans même roussir une semelle.","The lava river flowed with a growl, far too wide to jump. Block by block, just like the wall around the house long ago, {name} built a stone bridge and crossed without even singeing a sole."],"nm":["Rivière de lave","Lava River"],"rw":["Tes ponts sur la lave restent, et un raccourci mène au village des Terres Brûlées","Your lava bridges stay, and a shortcut opens to the Badlands village"]},{"id":"C4","lane":"C","name":"Obsidienne","needs":["C3","P3"],"g":{"e":"kill","mob":"golem"},"n":1,"t":["Vaincre un golem d’obsidienne dans les champs de roche","Beat an obsidian golem in the rock fields"],"eff":"Obsidian blocks unlocked","sc":"lava","page":["Le golem d'obsidienne barrait la carrière, lent comme la nuit et dur comme elle. Le marteau en vint à bout, et le vieux mineur avait appris à {nom} le reste : où frapper, quand s'arrêter. La roche noire céda cinq éclats parfaits.","The obsidian golem blocked the quarry, slow as night and just as hard. The hammer got the better of it, and the old miner had taught {name} the rest: where to strike, when to stop. The black rock gave up five perfect shards."],"nm":["Obsidienne","Obsidian"],"rw":["Blocs d’obsidienne débloqués","Obsidian blocks unlocked"]},{"id":"C5","lane":"C","name":"Diablotins","needs":["C3"],"g":{"e":"kill","mob":"imp"},"n":6,"t":["Vaincre 6 diablotins dans les plaines de cendre","Beat 6 fire imps on the ash plains"],"eff":"Imps stop raiding the Badlands village","sc":"lava","page":["Les diablotins riaient en lançant des étincelles sur le village des Terres Brûlées. Dix d'entre eux plus tard, plus personne ne riait — sauf les villageois, enfin tranquilles.","The imps cackled as they flung sparks at the Badlands village. Ten of them later, nobody was laughing — except the villagers, finally left in peace."],"nm":["Diablotins","Imps"],"rw":["Les diablotins cessent d’attaquer le village des Terres Brûlées","Imps stop raiding the Badlands village"]},{"id":"C6","lane":"C","name":"Cape du vent","needs":["C1"],"g":{"e":"craft","id":"windCloak"},"n":1,"t":["Attraper un esprit du vent dans une bouteille, puis tisser la cape du vent","Catch a gust sprite in a bottle, then weave the wind cloak"],"eff":"Gusts push you half as far","sc":"sky","page":["Sur les Îles du Ciel, un esprit du vent aimait pousser les voyageurs dans le vide, pour rire. {nom} l'attrapa dans une bouteille et le cousit dans la doublure d'une cape : depuis, le vent souffle avec {nom}, et non plus contre.","On the Sky Islands a gust sprite liked pushing travellers off the edge, for fun. {name} caught it in a bottle and sewed it into the lining of a cloak: since then the wind blows with {name}, not against."],"nm":["Cape du vent","Wind Cloak"],"rw":["Les rafales te poussent deux fois moins loin","Gusts push you half as far"]},{"id":"C7","lane":"C","name":"Ponts de corde","needs":["C6","F10"],"g":{"e":"flag","f":"skyBridges"},"n":1,"t":["Reconstruire 3 ponts entre les îles en bois lié à la toile (4 bois + 2 toiles chacun)","Rebuild 3 bridges between the islands as web-bound wood (wood 4 + web 2 each)"],"eff":"Shortcuts between islands","sc":"sky","page":["Trois ponts de corde pendaient, déchirés, au-dessus du vide. {nom}, qui avait déjà réparé un toit sous la pluie, ne trembla pas : nœud après nœud, les îles se tendirent de nouveau la main.","Three rope bridges hung torn above the void. {name}, who had once mended a roof in the rain, did not tremble: knot after knot, the islands held hands again."],"nm":["Ponts de corde","Rope Bridges"],"rw":["Des raccourcis entre les îles","Shortcuts between islands"]},{"id":"C8","lane":"C","name":"Plumes","needs":["C7"],"g":{"e":"kill","mob":"harpy"},"n":2,"t":["Prendre les plumes de 2 harpies","Take feathers from 2 harpies"],"eff":"Slow-fall when you hold Jump","sc":"sky","page":["Les harpies fondaient du ciel pour soulever les voyageurs et les lâcher de très haut. {nom} les attendit de pied ferme et leur prit cinq grandes plumes, longues comme un bras. Avec elles, {nom} apprit à tomber doucement, comme une feuille d'automne qui prend son temps.","The harpies swooped from the sky to lift travellers and drop them from very high up. {name} stood firm and took five great feathers from them, each as long as an arm. With them {name} learned to fall gently, like an autumn leaf taking its time."],"nm":["Plumes","Feathers"],"rw":["Chute lente en tenant Saut","Slow-fall when you hold Jump"]},{"id":"C9","lane":"C","name":"Le nid","needs":["C8"],"g":{"e":"reach","kind":"nest"},"n":1,"t":["Rebondir sur les méduses des nuages jusqu’à la plus haute île","Bounce on cloud jellyfish up to the highest island"],"eff":"A view of all lands from the top","sc":"sky","page":["Pour monter tout en haut, il fallut rebondir sur le dos des méduses des nuages, une, deux, trois, comme sur des lits moelleux. Dans un nid grand comme une maison, {nom} regarda le monde : la petite maison, les villages, la mer, le Nord. Tout cela, pensa {nom}, mérite qu'on le protège.","To climb to the top, {name} had to bounce on the backs of the cloud jellyfish, one, two, three, like soft beds. From a nest as big as a house, {name} looked out over the world: the little house, the villages, the sea, the North. All of it, {name} thought, is worth protecting."],"nm":["Le nid","The Nest"],"rw":["Une vue sur toutes les terres depuis le sommet","A view of all lands from the top"]},{"id":"C10","lane":"C","name":"Forge noire","needs":["C4","C5","C12"],"g":{"e":"craft","id":"obsidianBlade"},"n":1,"t":["Forger la lame d’obsidienne à la forge noire","Forge the obsidian blade at the black forge"],"eff":"The best sword in the game","sc":"lava","page":["Le forgeron des Terres Brûlées battit l'obsidienne trois jours et trois nuits. La lame qui en sortit était noire comme la nuit et chantait doucement chaque fois qu'on la tirait du fourreau.","The Badlands smith hammered the obsidian for three days and three nights. The blade that came out was black as night and sang softly whenever it left its sheath."],"nm":["Forge noire","Black Forge"],"rw":["La meilleure épée du jeu : elle perce les armures","The best sword in the game: it pierces armour"]},{"id":"C11","lane":"C","name":"Harpes du vent","needs":["C9","P7","L14"],"g":{"e":"flag","f":"harps"},"n":1,"t":["Jouer l’air des harpes du vent, dans l’ordre","Play the wind harps’ tune, in order"],"eff":"A new song joins the playlist","sc":"sky","page":["Sur les cordes des harpes du vent, {nom} rejoua l'air de la vieille boîte à musique, note pour note. Les nuages s'écartèrent, et quelque part, très loin sous la terre, quelque chose soupira.","On the strings of the wind harps, {name} played the old music box's tune, note for note. The clouds parted, and somewhere far beneath the earth, something sighed."],"nm":["Harpes du vent","Wind Harps"],"rw":["Une nouvelle chanson rejoint la liste","A new song joins the playlist"]},{"id":"C12","lane":"C","name":"Poudre noire","needs":["C3"],"g":{"e":"kill","mob":"beetle"},"n":2,"t":["Récolter la poudre de 2 scarabées-bombes pour ouvrir la forge scellée","Collect blasting powder from 2 bomb beetles to open the sealed forge"],"eff":"Blasting powder: mine 3 tiles at once","sc":"lava","page":["La forge noire était scellée par un éboulis. Trois scarabées-bombes plus tard — attirés, esquivés, et pas trop près s'il vous plaît —, {nom} avait assez de poudre pour faire sauter les rochers. BOUM ! La porte de la forge apparut dans la poussière.","The black forge was sealed by a rockfall. Three bomb beetles later — lured, dodged, and not too close, please — {name} had enough powder to blast the rocks. BOOM! The forge door appeared through the dust."],"nm":["Poudre noire","Black Powder"],"rw":["Poudre noire : mine 3 cases d’un coup","Blasting powder: mine 3 tiles at once"]},{"id":"C13","lane":"C","name":"La nuit des gargouilles","needs":["C7"],"g":{"e":"kill","mob":"gargoyle"},"n":3,"t":["Survivre une nuit dans les ruines des îles et briser 3 gargouilles","Survive a night in the island ruins and smash 3 gargoyles"],"eff":"Stone hearts open the Queen of Winds' tower","sc":"sky","page":["Le jour, les gargouilles avaient servi de bancs à {nom} pour regarder les nuages. La nuit, elles se réveillèrent. Trois coups de marteau et trois cœurs de pierre plus tard, la porte de la tour de la Reine des Vents se mit à trembler.","By day, {name} had sat on the gargoyles to watch the clouds. By night, they woke up. Three hammer blows and three stone hearts later, the door of the Queen of Winds' tower began to shake."],"nm":["La nuit des gargouilles","Night of the Gargoyles"],"rw":["Les cœurs de pierre ouvrent la tour de la Reine des Vents","Stone hearts open the Queen of Winds’ tower"]},{"id":"E1","lane":"F","name":"Le Grand Siège","needs":["F8","F11","F12","L12","L16"],"g":{"e":"flag","f":"grandSiege"},"n":1,"t":["Tenir 3 nuits de siège à la maison : garde la porte et ne laisse aucun monstre debout à l’aube (pas forcément de suite)","Hold 3 siege nights at home: guard the door and leave no monster standing at dawn (not necessarily in a row)"],"eff":"Trophy: the village banner. Sieges are smaller from then on. Max energy +10 %.","sc":"home","page":["Trois nuits durant, les monstres battirent les murs comme une mer en colère. Mais cette fois, {nom} avait des amis : les gardes du village, le chiot, la tour et chaque pierre du mur tinrent bon. Au troisième matin, le soleil se leva sur une maison debout, et sur un drapeau tout neuf qui claquait au vent.","For three nights the monsters pounded the walls like an angry sea. But {name} was no longer alone in the world: the village guards, the pup, the tower and every stone of the wall held fast. On the third morning the sun rose over a house still standing, and over a brand-new banner snapping in the wind."],"end":1,"nm":["Le Grand Siège","The Great Siege"],"rw":["Trophée : la bannière du village. Sièges plus petits. Énergie max +10 %","Trophy: the village banner. Smaller sieges. Max energy +10 %"]},{"id":"E2","lane":"P","name":"La Bibliothèque engloutie","needs":["P10","P11","P8","L4","P13"],"g":{"e":"flag","f":"library"},"n":1,"t":["Dans la bibliothèque engloutie de l’Autre Rive (sous un lac ou un vieux puits) : 7 pierres de suite au niveau + 2 avant que l’eau monte. Une erreur la fait monter ; inondé, tu reviens demain.","In the Far Shore’s sunken library (under a lake or an old well): 7 stones in a row at grade + 2 before the water rises. A mistake raises it; flooded, you try again tomorrow."],"eff":"Trophy: the golden abacus. Tablets give two more tries. The Scholars' story is told. Max energy +10 %.","sc":"flood","page":["L'eau montait, sept pierres attendaient, et il n'y avait pas de temps pour hésiter. Quand la dernière réponse résonna, la bibliothèque des Savants livra son secret : sous la petite maison dort la Grande Moule, et c'est sa chanson triste qui appelle les monstres chaque nuit. Sur la dernière page du registre, {nom} reconnut l'écriture de grand-mère.","The water was rising, seven stones were waiting, and there was no time to hesitate. When the last answer rang out, the Scholars' library gave up its secret: under the little house sleeps the Great Mussel, and it is her sad song that calls the monsters every night. On the last page of the register, {name} recognised Grandma's handwriting."],"end":1,"nm":["La Bibliothèque engloutie","The Sunken Library"],"rw":["Trophée : le boulier d’or. Deux essais de plus aux pierres. Énergie max +10 %","Trophy: the golden abacus. Two more tries at stones. Max energy +10 %"]},{"id":"E3","lane":"L","name":"Le Roi du Givre","needs":["L11"],"g":{"e":"kill","mob":"frostKing"},"n":1,"t":["Entrer dans la salle de glace (ouverte par l’ancien des igloos) et vaincre le Roi du Givre","Enter the ice hall (opened by the igloo elder) and beat the Frost King"],"eff":"Trophy: the frost crown, first seal. The fork crossing opens (required). Max energy +10 %.","sc":"snow","page":["Le Roi du Givre se battit comme une tempête, puis tomba à genoux. « Je gardais l'un des sceaux, souffla-t-il en tendant sa couronne. Elle se réveille. Les deux autres gardiens ont perdu la tête. Va. » Et derrière lui, la route du sud s'ouvrit.","The Frost King fought like a blizzard, then fell to his knees. \"I guarded one of the seals,\" he breathed, holding out his crown. \"She is waking. The other two guardians have lost their minds. Go.\" And behind him, the southern road opened."],"end":1,"nm":["Le Roi du Givre","The Frost King"],"rw":["Trophée : la couronne de givre, premier sceau. La fourche s’ouvre. Énergie max +10 %","Trophy: the frost crown, first seal. The fork opens. Max energy +10 %"]},{"id":"E4","lane":"C","name":"Braises et Vents","needs":["C10","C11","C13"],"g":{"e":"flag","f":"twoBosses"},"n":1,"t":["Vaincre le Seigneur des Braises et la Reine des Vents, dans l’ordre que tu veux","Beat the Lord of Embers and the Queen of Winds, in either order"],"eff":"Trophies: ember heart and wind feather, the last two seals. Both climates ease by half. Max energy +10 %.","sc":"sky","page":["Le Seigneur des Braises s'éteignit comme un feu de camp au petit matin, et la Reine des Vents se tut comme une tempête qui s'endort. Chacun laissa un sceau : un cœur de braise, une plume de vent. Les trois gardiens avaient parlé ; il ne restait plus qu'à rentrer à la maison.","The Lord of Embers went out like a campfire at dawn, and the Queen of Winds fell silent like a storm falling asleep. Each left a seal: an ember heart, a wind feather. All three guardians had spoken; there was nothing left but to go home."],"end":1,"nm":["Braises et Vents","Embers and Winds"],"rw":["Trophées : cœur de braise et plume du vent, les derniers sceaux. Énergie max +10 %","Trophies: ember heart and wind feather, the last seals. Max energy +10 %"]},{"id":"FIN","lane":"X","name":"Au cœur de la Mine-Moule","needs":["E1","E2","E3","E4"],"g":{"e":"flag","f":"lullaby"},"n":1,"t":["Descendre par le puits de la salle d’arcade, au cœur de la Mine-Moule","Go down the shaft in the arcade room, to the heart of the Mine-Moule"],"eff":"Credits roll over the night sky. Nights are gentler from then on; the world carries on and the costume quests open.","sc":"mine","page":["Sous la petite maison, au plus profond de la Mine-Moule, la Grande Moule ouvrit un œil grand comme la lune. Elle n'était pas méchante : elle était seule, et elle chantait sa peine depuis mille ans. {nom} rangea son épée, posa les trois sceaux sur la vieille boîte à musique et joua la chanson des Savants, celle de grand-mère. La Grande Moule écouta, ferma son œil, et se rendormit, consolée. Depuis, les nuits sont plus douces, et dans la petite maison au bout du chemin, quelqu'un dort très bien. Fin… ou presque.","Under the little house, deep in the heart of the Mine-Moule, the Great Mussel opened an eye as big as the moon. She was not wicked: she was lonely, and she had been singing her sorrow for a thousand years. {name} put the sword away, set the three seals on the old music box and played the Scholars' song, Grandma's song. The Great Mussel listened, closed her eye, and went back to sleep, comforted. Since then the nights have been gentler, and in the little house at the end of the road, someone sleeps very well. The end… or almost."],"end":1,"nm":["Au cœur de la Mine-Moule","The Heart of the Mine-Moule"],"rw":["Le générique sous les étoiles, des nuits plus douces et les quêtes de costumes","Credits under the stars, gentler nights and the costume quests"]}],"P0":{"id":"P0","name":"Prologue","sc":"home","page":["Grand-mère avait laissé deux choses à {nom} : sa petite maison au bout du chemin, et un livre aux pages blanches posé sur la table de chevet. Sur la première page, de sa belle écriture penchée, elle avait écrit : « Ici commence ton histoire. Écris-la bien. »","Grandma left {name} two things: her little house at the end of the road, and a book of blank pages on the bedside table. On the first page, in her lovely slanted hand, she had written: \"Here begins your story. Write it well.\""],"nm":["Prologue","Prologue"]}};
const QUESTS = QDATA.Q, QMAP = {}; for (const q of QUESTS) QMAP[q.id] = q;
// 1.11: quest names, rewards and texts in both languages; targets that fit the world
const QEN = () => Save.d.lang === 'en';
function qName(q) { return q.nm ? q.nm[QEN() ? 1 : 0] : q.name; }
function qNeed(q) { if (q.id === 'F9' && G.world && G.world.areas[0]) { const nv = G.world.areas[0].envs.filter((e) => e.type === 'village').length; return Math.max(1, Math.min(q.n, nv)); } return q.n; }
function qText(q) { return q.t[QEN() ? 1 : 0].replace('{n}', qNeed(q)); }
function qReward(q) { return q.rw ? q.rw[QEN() ? 1 : 0] : (q.eff || ''); }
function qLaneName(k) { const Lx = L(); return { F: Lx.laneF, P: Lx.laneP, L: Lx.laneL, C: Lx.laneC, X: 'Finale' }[k] || ''; }

// ── 1.8.3: what's new — pages by version series, tag filters, a scroller (wheel, drag, ↑ ↓, scrollbar) ──

    else if (G.panel && !(G.panel === 'chest' && G.chestX) && !(G.panel === 'map' && G.mapZ && G.mapZ.tz > 1) && !(G.panel === 'map' && G.qt) && (Input.hit('pause') || (Input.hit('back') && G.panel !== 'tablet') || (G.panel === 'inv' && Input.hit('inv')) || (G.panel === 'equip' && Input.hit('equip')))) { G.panel = null; Audio.sfx('click'); }

  if (Input.click && !G.modal) { const c = Input.click; let hit = false; for (let i = G.hits.length - 1; i >= 0; i--) { const h = G.hits[i]; if (c.x >= h[0] && c.x < h[0] + h[2] && c.y >= h[1] && c.y < h[1] + h[3]) { h[4](); hit = true; break; } } if (!hit && G.scene === 'PLAY' && !G.panel && !G.fade && !G.combat) worldClick(c); }

  const shx = G.shake > 0 ? Math.round((Math.random() * 6 - 3) * VIEW.s) : 0, shy = G.shake > 0 ? Math.round((Math.random() * 6 - 3) * VIEW.s) : 0; G.shake = Math.max(0, (G.shake || 0) - dt);
  vctx.drawImage(buf, 0, 0, W, H, VIEW.x + shx, VIEW.y + shy, VIEW.w, VIEW.h);

}
